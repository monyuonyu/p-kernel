  # =========================================================================
  # STRICT GATES (ci-strict-gates wave) — three high-signal checks the audit
  # found were NOT enforced anywhere: the crown .text byte-identity invariant,
  # the connect-anywhere + supernode in-proc certs, and a sanitizer build.
  # =========================================================================

  crown-text-identity:
    # crown 不変条件 (BLOCKING). The bare-metal kernels' .text must stay
    # BYTE-IDENTICAL across a commit unless bare-metal is INTENTIONALLY changed —
    # the machine-code-level "one mind, one math" invariant. ANY change to a TU
    # that links into boot/x86 or boot/aarch64 (arch/common, kernel/common, the
    # bare-metal arch backends) flips .text and FAILS this gate.
    #
    # WHY RELATIVE, NOT AN ABSOLUTE PINNED HASH: the .text bytes are
    # TOOLCHAIN-DEPENDENT. The canonical dev crown (aarch64 755a20fa…, x86
    # 4064d8a9…) is produced by the sandbox gcc 15.2.0; the ubuntu-latest CI
    # runner ships a different gcc (13/14) and emits different — but equally
    # valid — machine code, so an absolute-hash assert is RED on every commit in
    # CI for a toolchain reason, not a real drift. So this gate enforces the REAL
    # invariant in a toolchain-independent way: build .text at HEAD AND at HEAD^
    # with the SAME runner toolchain and require them byte-identical. Hosted-only
    # / docs commits → identical → green; a commit that actually moves bare-metal
    # .text → differ → red (correct: an intentional bare-metal change must be
    # reviewed and re-baseline the dev crown in docs/audit-trail.md). The absolute
    # dev crown stays the per-wave audit anchor (same sandbox toolchain).
    # HONEST BOUND: compares HEAD vs its immediate parent, so a multi-commit push
    # only diff-checks its TOP commit against the one before it.
    name: "crown 不変条件 (.text バイト同一性 — 対親ドリフト)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD^ for the relative compare
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-i686-linux-gnu gcc-aarch64-linux-gnu make
      - name: Assert bare-metal .text is byte-identical to the parent commit
        run: |
          set -e
          if ! git rev-parse -q --verify HEAD^ >/dev/null; then
            echo "no parent commit (root/shallow) — skipping relative crown check"; exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD); PARENT_SHA=$(git rev-parse HEAD^)
          echo "HEAD=$HEAD_SHA  parent=$PARENT_SHA"
          build_text() {   # $1 = output tag
            make -C boot/aarch64 clean   >/dev/null 2>&1 || true
            make -C boot/x86     clean   >/dev/null 2>&1 || true
            make -C boot/aarch64         >/dev/null
            aarch64-linux-gnu-objcopy -O binary -j .text boot/aarch64/kernel.elf "/tmp/a_$1.bin"
            make -C boot/x86 kernel.elf  >/dev/null
            i686-linux-gnu-objcopy    -O binary -j .text boot/x86/kernel.elf     "/tmp/x_$1.bin"
          }
          build_text head
          git checkout -q -f "$PARENT_SHA"
          build_text parent
          git checkout -q -f "$HEAD_SHA"
          AH=$(sha256sum /tmp/a_head.bin   | cut -d' ' -f1)
          AP=$(sha256sum /tmp/a_parent.bin | cut -d' ' -f1)
          XH=$(sha256sum /tmp/x_head.bin   | cut -d' ' -f1)
          XP=$(sha256sum /tmp/x_parent.bin | cut -d' ' -f1)
          echo "aarch64 .text: head=$AH parent=$AP"
          echo "x86     .text: head=$XH parent=$XP"
          fail=0
          [ "$AH" = "$AP" ] || { echo "CROWN DRIFT (aarch64): this commit changed bare-metal .text vs its parent."; fail=1; }
          [ "$XH" = "$XP" ] || { echo "CROWN DRIFT (x86): this commit changed bare-metal .text vs its parent."; fail=1; }
          if [ "$fail" = 1 ]; then
            echo "If the bare-metal change is INTENTIONAL: document it + re-baseline the dev crown. Else it is accidental .text drift."
            exit 1
          fi
          echo "crown OK — bare-metal .text byte-identical to parent (toolchain-independent)."

  connect-anywhere-certs:
    # 接続フォールバック cert (BLOCKING). Wires the three in-process certs that
    # were shipped but never run in CI: the unconditional relay keepalive
    # (heartbeat), the automatic UDP<->TCP transport fallback (autoxport), and
    # the measured-fitness supernode auto-promotion (autopromote). Each harness
    # builds a CURE and a FALSIFIER and asserts cure-PASS + falsifier-FAIL, so a
    # toothless implementation is caught (the falsifier is exercised). The
    # harnesses drive BOTH host arches: the x86_64-hosted leg runs NATIVELY on
    # this x86_64 runner; the aarch64-hosted leg cross-builds (gcc-aarch64-
    # linux-gnu + libc6-dev-arm64-cross) and executes transparently under
    # qemu-user-static via binfmt, with QEMU_LD_PREFIX pointing the emulator at
    # the aarch64 glibc (same emulation the ump-aarch64-cross job already uses).
    name: "接続フォールバック cert (heartbeat / UDP↔TCP / スーパーノード自動昇格)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # qemu-user honours QEMU_LD_PREFIX as the -L runtime library path, so the
      # cross-built aarch64 ./p-kernel finds its glibc loader/libs under binfmt.
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains + qemu-user (aarch64 leg under emulation)
        run: |
          sudo apt-get update
          # gcc/make: native x86_64 leg. gcc-aarch64-linux-gnu + libc6-dev-arm64-
          # cross: cross-build the aarch64-hosted leg (real aarch64 glibc
          # headers, like ump-aarch64-cross). qemu-user-static + binfmt-support:
          # register the aarch64 binfmt handler so the harness's direct
          # `./p-kernel` invocation of the aarch64 ELF runs under qemu.
          sudo apt-get install -y --no-install-recommends \
            gcc make gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user-static binfmt-support
      - name: heartbeat cert (unconditional relay keepalive — connect-anywhere SLICE 1)
        run: bash tests/run_heartbeat.sh
      - name: autofallback cert (automatic UDP<->TCP relay transport — SLICE 4)
        run: bash tests/run_autofallback.sh
      - name: autopromote cert (measured-fitness supernode auto-promotion — N-2d)
        run: bash tests/run_autopromote.sh
      - name: cooperative-yield cert (DMN sleep must not starve the node; slicing byte-identical)
        # docs/architecture/cooperative-yield-plan.md. Builds the cure + the
        # -DYIELD_DISABLE falsifier and asserts cure-PASS + falsifier-RED, so a
        # toothless (non-slicing) implementation is caught. Native gcc + -lm only.
        run: bash tests/llm/run_yield.sh

  sanitizer-build:
    # サニタイザ build (ASan/UBSan, 助言). ADVISORY until clean; promote to
    # blocking once green — catches the recurring stack-overflow class (the
    # net_relay.c buf[MAX_PKT] stack-locals bug that crashed the hosted relay;
    # see feedback_hosted_relay_stack_overflow). Builds boot/linux_x86_64
    # NATIVELY on the x86_64 runner with -fsanitize=address,undefined and runs a
    # boot+selftest+exit smoke under the sanitizer runtime. No Makefile edit is
    # needed: the existing EXTRA_CFLAGS hook injects the instrument flags into
    # CFLAGS (and the inheriting KERNEL_CFLAGS), and LDFLAGS is OVERRIDDEN on the
    # make command line to link the sanitizer runtime and drop -static (ASan
    # does not support fully-static links). The arch/common/llm engine TUs use a
    # separate LLM_CFLAGS and stay uninstrumented (acceptable for an advisory
    # smoke); the net/relay/kernel/arch TUs where the stack-overflow class lives
    # ARE instrumented. Bare-metal builds are untouched -> the crown stays
    # byte-identical.
    name: "サニタイザ build (ASan/UBSan, 助言)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build boot/linux_x86_64 with ASan+UBSan (native x86_64)
        # NO_LIBTCC=1: the LDFLAGS override below drops -ltcc, so the selfc
        # libtcc path must be compiled out too (else undefined tcc_* at link if
        # the runner happens to carry libtcc). selfc is a stub here — fine for a
        # boot smoke. EXTRA_CFLAGS instruments every TU except the LLM engine
        # (separate LLM_CFLAGS); LDFLAGS links the sanitizer runtime + drops
        # -static (ASan cannot link fully-static).
        run: |
          make -C boot/linux_x86_64 NO_LIBTCC=1 \
            EXTRA_CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            LDFLAGS="-no-pie -lrt -lpthread -fsanitize=address,undefined"
      - name: Smoke (boot + pfs/hrw selftest + exit) under the sanitizer
        run: |
          cd boot/linux_x86_64
          # detect_leaks=0: the kernel intentionally never frees (LSan noise).
          # We care about the stack-overflow / UB class, surfaced as a report.
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          printf 'pfs\nhrw\nexit\n' | timeout 180 ./p-kernel 2>&1 | tee asan_smoke.log || true
          if grep -aiE 'AddressSanitizer|runtime error:|SUMMARY: (Address|Undefined)Sanitizer' asan_smoke.log; then
            echo "SANITIZER REPORT surfaced above (advisory — does not block)."
            exit 1
          fi
          echo "sanitizer smoke clean"

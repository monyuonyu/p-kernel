# p-kernel minimal CI
#
# Answers the PR #3 critique: "84k lines, the only real automated test is
# the relay, no GitHub Actions, and the aarch64 UMP build breaks on x86_64
# hosts with nothing to detect it."
#
# Five lean jobs, no matrix:
#   ump-x86_64        — native build of boot/linux_x86_64 + the kernel's own
#                       pfs/hrw + §7/§8 moe property self-tests (I7/I8/D0/§5)
#                       driven through the shell via stdin.
#   ump-aarch64-cross — cross-build of boot/linux on an x86_64 host. THE
#                       previously-missing check. Bonus: self-tests under
#                       qemu-user (non-blocking).
#   bare-metal        — build-only: boot/x86 (i686) and boot/aarch64 ELFs.
#   relay-tests       — the existing 6-scenario relay round-trip suite.
#   survival-loop     — death-piercing: 3-node DKVA inference over the relay
#                       with SIGKILLs mid-inference (wave 8); asserts the
#                       swarm completes every inference, marked degraded(k/n).
#   protect-loop-live — live 3-node protected-object loop (wave 14 / G28+G32):
#                       a declared unit's grounded threat falls to 0 BECAUSE
#                       the swarm replicated it to R durable neighbours, then
#                       it survives kill -9 of its owner; actuator-off control
#                       stays AT-RISK and loses the unit. Asserts RESULT: PASS.
#
# Plus one BONUS (non-blocking) job:
#   composite-loop    — the G19 composite: ONE 4-node cluster where 殺す ∧
#                       同時多発 ∧ 記憶で考える overlap, plus revival + world map
#                       (wave 12). continue-on-error while it proves stable on
#                       hosted runners (timing-heavy: SWIM + p-fs gossip +
#                       revival). See docs/architecture/composite-scenarios.md;
#                       promote to blocking once stable.

name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master, 'feat/**']

jobs:
  ump-x86_64:
    name: UMP x86_64 (build + self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build (native x86_64 — Makefile auto-detects host arch)
        run: make -C boot/linux_x86_64
      - name: Kernel self-tests (pfs + hrw via shell stdin)
        run: |
          cd boot/linux_x86_64
          timeout 280 sh -c "printf 'pfs\nhrw\nmoe test\ndkva test\nreflex test\nprotect test\ndtr gossip test\ndtr gossip g38\nr3 test\nexit\n' | ./p-kernel" | tee selftest.log
          grep -aF '[pfs] PASS' selftest.log
          grep -aF '[hrw] PASS' selftest.log
          grep -aF '[hrw-l1] PASS' selftest.log
          # §7/§8 thought-core property tests (philosophy-gap-audit G3)
          grep -aF '[moe-nocentral] PASS' selftest.log
          grep -aF '[moe-twolayer] PASS' selftest.log
          grep -aF '[moe-osc] PASS' selftest.log
          grep -aF '[moe-concurrent] PASS' selftest.log
          # §2 G20: load/threat sign separation — rally, not flee (wave 13).
          # audit-4 acceptance #5: the green MUST be CI-enforced, not sim/doc-only.
          grep -aF '[moe-protect] PASS' selftest.log
          # 本丸 ONE BRAIN (wave 18): moe_infer's three brains unified onto one
          # dtr forward (docs/review-2026-06-three-brains.md). returned==routed
          # ==guarded from one forward; all 4 channels affect the gate (the
          # (void) discard is gone); the live path follows the learned dtr, not
          # ai_job.c's handwritten-constant MLP; and collective learning (G22)
          # now lifts the RETURNED accuracy (the brain the output never read).
          grep -aF '[onebrain-unified] PASS' selftest.log
          grep -aF '[onebrain-channels] PASS' selftest.log
          grep -aF '[onebrain-nomlp] PASS' selftest.log
          grep -aF '[onebrain-accuracy] PASS' selftest.log
          # §8 reflex closed loop + deliberation learning (closes audit G27:
          # the reflex self-test was previously never invoked in CI).
          grep -aF '[reflex-fb] PASS' selftest.log
          grep -aF '[reflex-learn] PASS' selftest.log
          # §2 G28: threat grounded in under-replication + actuator closes the
          # loop (threat falls because of replication, not a timer; wave 14).
          grep -aF '[protect-ground] PASS' selftest.log
          grep -aF '[protect-loop] PASS' selftest.log
          # §2 ∧ §5 G35: MANY protected points defended IN PARALLEL — all reach
          # R replicas in ~one-point time (not N*), fair, none starves (wave 15).
          grep -aF '[plural-protect] PASS' selftest.log
          # §8/§9 G22 (wave 16): DECENTRALIZED COLLECTIVE LEARNING. Nodes on
          # DISJOINT (leave-one-class-out) shards each cap low on the full task
          # (shard-solo); gossip-averaging full weight bodies with NO central
          # aggregator lifts accuracy ABOVE that solo ceiling (gossip-learn);
          # the merge is peer-symmetric, no aggregator index (no-central).
          grep -aF '[g22-shard-solo] PASS' selftest.log
          grep -aF '[g22-gossip-learn] PASS' selftest.log
          grep -aF '[g22-no-central] PASS' selftest.log
          # §8/§9 G38 (wave 17): THINKING CHANGES GUARDING. The learned
          # transformer's REAL max-softmax confidence gates the reflex (was a
          # dead 0xFF that always fired = G34); a COLLECTIVELY-LEARNED model
          # guards measurably better than an UNLEARNED one; and the reflex's
          # per-class threat experience prioritizes the learning (two-layer
          # couple — audit-7 §4.3).
          grep -aF '[g38-confidence-live] PASS' selftest.log
          grep -aF '[g38-learning-improves-guarding] PASS' selftest.log
          grep -aF '[g38-guard-feeds-learning] PASS' selftest.log
          grep -aF '[g13-parallel] PASS' selftest.log
          # R3 (non-trivial thought): in-context associative recall. The SAME
          # dtr kernels (dt_linear/dt_softmax/LayerNorm fwd+bwd) learn a function
          # NO hand-written if can — the dictionary is resampled every episode,
          # so any fixed input->label rule is at/near chance (handif), random
          # weights are chance (frozen), the analytic backward grad-checks, and
          # the learned held-out accuracy beats both by >=30 pts (learned).
          grep -aF '[r3-incontext-gradcheck] PASS' selftest.log
          grep -aF '[r3-incontext-frozen] PASS' selftest.log
          grep -aF '[r3-incontext-handif] PASS' selftest.log
          grep -aF '[r3-incontext-learned] PASS' selftest.log

  ump-aarch64-cross:
    name: UMP aarch64 (cross-build on x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + qemu-user
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross: the hosted UMP build (_TK_HOSTED_LIBC_) needs
          # real aarch64 glibc headers; --no-install-recommends skips them and
          # the cross gcc falls back to the host's /usr/include and dies on
          # bits/libc-header-start.h. (Also pulls libc6-arm64-cross, which
          # provides /usr/aarch64-linux-gnu for the qemu-user -L below.)
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross make qemu-user-static
      - name: Cross-build (Makefile auto-selects aarch64-linux-gnu- off-host)
        run: make -C boot/linux
      - name: Verify artifact is aarch64
        run: file boot/linux/p-kernel | grep -F 'ARM aarch64'
      - name: Kernel self-tests under qemu-aarch64 (bonus, non-blocking)
        continue-on-error: true
        run: |
          cd boot/linux
          timeout 150 sh -c "printf 'pfs\nhrw\nmoe test\ndkva test\nreflex test\nprotect test\ndtr gossip test\ndtr gossip g38\nexit\n' | \
            qemu-aarch64-static -L /usr/aarch64-linux-gnu ./p-kernel" | tee selftest.log
          grep -aF '[pfs] PASS' selftest.log
          grep -aF '[hrw] PASS' selftest.log
          grep -aF '[hrw-l1] PASS' selftest.log
          grep -aF '[moe-nocentral] PASS' selftest.log
          grep -aF '[moe-twolayer] PASS' selftest.log
          grep -aF '[moe-osc] PASS' selftest.log
          grep -aF '[moe-concurrent] PASS' selftest.log
          grep -aF '[moe-protect] PASS' selftest.log
          # 本丸 ONE BRAIN (wave 18): three brains unified onto one dtr forward
          grep -aF '[onebrain-unified] PASS' selftest.log
          grep -aF '[onebrain-channels] PASS' selftest.log
          grep -aF '[onebrain-nomlp] PASS' selftest.log
          grep -aF '[onebrain-accuracy] PASS' selftest.log
          grep -aF '[reflex-fb] PASS' selftest.log
          grep -aF '[reflex-learn] PASS' selftest.log
          # §2 G28 grounded threat + closed loop (wave 14)
          grep -aF '[protect-ground] PASS' selftest.log
          grep -aF '[protect-loop] PASS' selftest.log
          # §2 ∧ §5 G35 plural parallel protection (wave 15)
          grep -aF '[plural-protect] PASS' selftest.log
          # §8/§9 G22 decentralized collective learning (wave 16)
          grep -aF '[g22-shard-solo] PASS' selftest.log
          grep -aF '[g22-gossip-learn] PASS' selftest.log
          grep -aF '[g22-no-central] PASS' selftest.log
          # §8/§9 G38 two-layer couple — thinking changes guarding (wave 17)
          grep -aF '[g38-confidence-live] PASS' selftest.log
          grep -aF '[g38-learning-improves-guarding] PASS' selftest.log
          grep -aF '[g38-guard-feeds-learning] PASS' selftest.log
          grep -aF '[g13-parallel] PASS' selftest.log

  bare-metal:
    name: Bare-metal (i686 + aarch64, build-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-i686-linux-gnu gcc-aarch64-linux-gnu make
      - name: Build boot/x86 (bootloader.bin + kloader.bin + kernel.elf)
        run: make -C boot/x86 all
      - name: Build boot/aarch64 (QEMU virt kernel.elf)
        run: make -C boot/aarch64

  relay-tests:
    name: Relay round-trip suite (6 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build + run test_relay
        run: make -C relay test

  survival-loop:
    name: Survival loop (kill nodes mid-inference)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run kill_one.sh (scenarios A/B/C)
        run: timeout 600 samples/13_survival_loop/kill_one.sh
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: survival-loop-logs
          path: /tmp/sl13_*.log

  protect-loop-live:
    name: "Protect loop (live 3-node: threat closes by replication, unit survives kill)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # enforces the LIVE path of G28/G32, not just the in-process self-test:
    # a declared protected unit's grounded threat must fall to 0 BECAUSE the
    # swarm replicated it to R durable neighbours over the relay, and the unit
    # must then survive a kill -9 of its owner; the actuator-off control must
    # stay AT-RISK and lose the unit. (audit-5 #5 / G32.)
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run 27_protect/run.sh and assert RESULT PASS
        run: |
          timeout 400 samples/27_protect/run.sh | tee /tmp/p27_ci.log
          grep -q 'RESULT: PASS' /tmp/p27_ci.log
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protect-loop-live-logs
          path: /tmp/p27_*.log

  plural-protect-live:
    name: "Plural protect (live 3-node: MANY points defended IN PARALLEL, owner killed)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # enforces the LIVE §2 ∧ §5 path (G35): FOUR protected points declared at
    # once across TWO owners all reach R durable replicas concurrently — in ~the
    # time of ONE point (calibrated in-run), far under the 4*t_one serialized
    # bound — fairly, none starving; then the owner of two of them is killed and
    # both already-replicated points survive. Proves protection is plural (no
    # single-consciousness collapse), not just the single-point loop.
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run 28_plural_protect/run.sh and assert RESULT PASS
        run: |
          timeout 400 samples/28_plural_protect/run.sh | tee /tmp/p28_ci.log
          grep -q 'RESULT: PASS' /tmp/p28_ci.log
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plural-protect-live-logs
          path: /tmp/p28_*.log

  collective-learn-live:
    name: "Collective learning (live 3-node: disjoint shards, gossip > solo, node killed + rejoins)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # enforces the LIVE §8/§9 path (G22): 3 nodes each train on a DISJOINT
    # leave-one-class-out shard (no node sees the whole task), gossip-average
    # their full 635-param weight bodies over the relay with NO central
    # aggregator, and EVERY node ends ABOVE its own solo shard-only ceiling —
    # collective > individual, proven in numbers, not a copy. Then a node is
    # kill -9'd mid-learning (the survivors keep improving) and a node rejoins
    # and catches up via gossip. The in-process [g22-*] property tests are the
    # unit proof; this is the over-the-relay integration proof.
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run 32_collective_learn/run.sh and assert RESULT PASS
        run: |
          timeout 900 samples/32_collective_learn/run.sh | tee /tmp/p32_ci.log
          grep -q 'RESULT: PASS' /tmp/p32_ci.log
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collective-learn-live-logs
          path: /tmp/p32_*.log

  twolayer-couple-live:
    name: "Two-layer couple (live 3-node: collective learning improves GUARDING, node killed mid-flight)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # enforces the LIVE §8/§9 path (G38, wave 17): the learned transformer's
    # REAL max-softmax confidence gates the reflex (was a dead 0xFF = G34); 3
    # nodes on DISJOINT shards gossip-learn over the relay with NO central
    # aggregator, and EACH node's GUARD score (the learned model gating the
    # same reflex used live) ends ABOVE its own UNLEARNED baseline — learning
    # improved guarding, in numbers. A node is kill -9'd mid-learning and the
    # surviving swarm still guards. The in-process [g38-*] property tests are
    # the unit proof; this is the over-the-relay integration proof.
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run 34_twolayer/run.sh and assert RESULT PASS
        run: |
          timeout 900 samples/34_twolayer/run.sh | tee /tmp/p34_ci.log
          grep -q 'RESULT: PASS' /tmp/p34_ci.log
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twolayer-couple-live-logs
          path: /tmp/p34_*.log

  parallel-infer-live:
    name: "Parallel infer (live: N region-crossing inferences concurrent, not 200ms-serialized, survive kill)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # enforces G13 (wave 17): DKVA coordinator aggregation is per-origin and
    # event-driven (no single synchronous 200ms window); N simultaneous
    # region-crossing inferences run concurrently (t_N stays flat, far below the
    # old (N-1)*200ms re-serialization) and survive a node killed mid-flight.
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run 35_parallel_infer/run.sh and assert RESULT PASS
        run: |
          timeout 900 samples/35_parallel_infer/run.sh | tee /tmp/p35_ci.log
          grep -q 'RESULT: PASS' /tmp/p35_ci.log
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-infer-live-logs
          path: /tmp/p35_*.log

  ark-crash-fuzzer:
    name: "ARK crash fuzzer (reorder/torn/bitflip: 0 corrupt-served, 0 wedge)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ARK's crash-safety, enforced. A format-agnostic fuzzer drives ARK via the
    # sample-25 CLI and perturbs the on-disk image at the sector level
    # (prefix-truncate / reorder+drop / torn / bit-flip), remounts, and asserts:
    # a fresh mount yields a COMPLETE version and NEVER serves a corrupt byte.
    # Exits non-zero on any BUG (corrupt-served / wedged). Was RED by design
    # (4 BUG) until ARK-2 added read-fallback + SB replica + header resync + GC.
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3
      - name: Run ARK crash fuzzer (0 BUG required)
        run: timeout 400 bash samples/30_ark_crash/run.sh

  composite-loop:
    name: Composite loop (kill ∧ concurrent ∧ memory, bonus)
    runs-on: ubuntu-latest
    # heavy: SWIM convergence + p-fs gossip + a revival on one 4-node cluster.
    timeout-minutes: 25
    # bonus job: surface the G19 closed loop without blocking unrelated PRs
    # while it earns trust on hosted runners (see composite-scenarios.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Build kernel (native x86_64) + relay
        run: |
          make -C boot/linux_x86_64
          make -C relay
      - name: Run survive_think_concurrent.sh (one cluster, overlapping)
        run: timeout 1200 samples/22_composite/survive_think_concurrent.sh
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: composite-loop-logs
          path: /tmp/ci22_*.log

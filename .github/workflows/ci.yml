  ring3-survival:
    # ring3-core Wave B + C acceptance gates (docs/architecture/ring3-core.md
    # II.3 + III.4): boot the bare-metal i686 kernel in QEMU with the FAT32
    # user-ELF disk, type `ring3 test` then `ring3 mind` over serial, and
    # require BOTH greppable PASS tags.  One boot, two verbs (III.6).
    #   ring3 test — Wave B: ring-3 SYS_INFER class == LIVE ring-0 oracle,
    #     fault -> reap (exactly once, from ring 3) -> scheduler alive ->
    #     restart.
    #   ring3 mind — Wave C: the moe_infer/dtr forward COMPUTED IN RING 3
    #     on a user-space weights copy; kernel_infer_count delta == 0 across
    #     every ring-3 run; the -poison clause proves the user COPY is what
    #     computes; the crash triple re-proven against the fat ELF.
    name: ring3 survival + mind gate (boot QEMU x86)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain + QEMU + FAT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-i686-linux-gnu make qemu-system-x86 dosfstools mtools
      - name: Build kernel + disk image
        run: make -C boot/x86 all disk
      - name: Static link tripwire — the REAL forward lives in core_mind.elf (III.3c)
        # A build that links a stub forward instead of the real moe.c/dtr.c
        # loses these global symbols from the --gc-sections live set.
        # Necessary-not-sufficient: the runtime clauses (kdelta==0 + poison)
        # are the fence; this catches build rot one minute into CI.
        run: |
          i686-linux-gnu-nm userland/x86/12_ring3/03_core_mind/core_mind.elf | grep -E ' T moe_infer$'
          i686-linux-gnu-nm userland/x86/12_ring3/03_core_mind/core_mind.elf | grep -E ' T dtr_forward_probs$'
          i686-linux-gnu-nm userland/x86/12_ring3/03_core_mind/core_mind.elf | grep -E ' T dtr_weights_set$'
      - name: Boot QEMU, run `ring3 iso` + `ring3 test` + `ring3 mind` + `dproc test` + `fpu test`, grep all five gates
        run: |
          cd boot/x86
          # Send the verbs after the shell is up; keep stdin open while
          # they run (III.6: one boot).  `ring3 iso` is the ISO-USERPTR
          # confused-deputy gate (a kernel-range pointer syscall is rejected
          # with the fault error and the kernel memory is NOT written; a
          # valid user pointer still succeeds).  Debt wave adds the kill-path
          # teardown gate ([dproc-teardown]) and the x87 context-save
          # gate ([fpu-ctx]) — both FAIL on the pre-wave kernel.
          ( sleep 25; printf 'ring3 iso\n'; sleep 8; printf 'ring3 test\n'; sleep 90; \
            printf 'ring3 mind\n'; sleep 90; \
            printf 'dproc test\n'; sleep 40; printf 'fpu test\n'; sleep 90 ) | \
            timeout 380 qemu-system-x86_64 -m 256 -kernel bootloader.bin \
              -serial stdio -display none -cpu qemu64 \
              -netdev user,id=n0 -device rtl8139,netdev=n0 \
              -drive file=disk.img,format=raw,if=ide,index=0 \
              > ring3.log 2>&1 &
          QPID=$!
          # Poll for ALL FIVE gate tags, then stop QEMU early.
          for i in $(seq 1 370); do
            grep -aqF '[iso-userptr]' ring3.log && \
              grep -aqF '[ring3-survival]' ring3.log && \
              grep -aqF '[ring3-mind]' ring3.log && \
              grep -aqF '[dproc-teardown]' ring3.log && \
              grep -aqF '[fpu-ctx]' ring3.log && break
            sleep 1
          done
          kill $QPID 2>/dev/null || true
          wait $QPID 2>/dev/null || true
          cat ring3.log
          grep -aF '[iso-userptr] PASS' ring3.log
          grep -aF '[ring3-survival] PASS' ring3.log
          grep -aF '[ring3-mind] PASS' ring3.log
          grep -aF '[dproc-teardown] PASS' ring3.log
          grep -aF '[fpu-ctx] PASS' ring3.log


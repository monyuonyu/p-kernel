# p-kernel minimal CI
#
# Answers the PR #3 critique: "84k lines, the only real automated test is
# the relay, no GitHub Actions, and the aarch64 UMP build breaks on x86_64
# hosts with nothing to detect it."
#
# Five lean jobs, no matrix:
#   ump-x86_64        — native build of boot/linux_x86_64 + the kernel's own
#                       pfs/hrw + §7/§8 moe property self-tests (I7/I8/D0/§5)
#                       driven through the shell via stdin.
#   ump-aarch64-cross — cross-build of boot/linux on an x86_64 host. THE
#                       previously-missing check. Bonus: self-tests under
#                       qemu-user (non-blocking).
#   bare-metal        — build-only: boot/x86 (i686) and boot/aarch64 ELFs.
#   relay-tests       — the existing 6-scenario relay round-trip suite.
#   survival-loop     — death-piercing: 3-node DKVA inference over the relay
#                       with SIGKILLs mid-inference (wave 8); asserts the
#                       swarm completes every inference, marked degraded(k/n).
#   protect-loop-live — live 3-node protected-object loop (wave 14 / G28+G32):
#                       a declared unit's grounded threat falls to 0 BECAUSE
#                       the swarm replicated it to R durable neighbours, then
#                       it survives kill -9 of its owner; actuator-off control
#                       stays AT-RISK and loses the unit. Asserts RESULT: PASS.
#
# Plus one BONUS (non-blocking) job:
#   composite-loop    — the G19 composite: ONE 4-node cluster where 殺す ∧
#                       同時多発 ∧ 記憶で考える overlap, plus revival + world map
#                       (wave 12). continue-on-error while it proves stable on
#                       hosted runners (timing-heavy: SWIM + p-fs gossip +
#                       revival). See docs/architecture/composite-scenarios.md;
#                       promote to blocking once stable.

name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master, 'feat/**']

jobs:
  ump-x86_64:
    name: UMP x86_64 (build + self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          # libtcc-dev: selfc-ring3 (the self-built-unit immune boundary) needs
          # libtcc for THIS ABI to compile units. The x86_64 runner has the
          # x86_64 libtcc, so the boot/linux_x86_64 Makefile probe links it and
          # HAVE_LIBTCC turns on — `selfc test` then actually compiles+forks.
          sudo apt-get install -y --no-install-recommends gcc make libtcc-dev
      - name: Build (native x86_64 — Makefile auto-detects host arch)
        run: make -C boot/linux_x86_64
      - name: Kernel self-tests (pfs + hrw via shell stdin)
        run: |
          cd boot/linux_x86_64
          # LM-6 (living-mind Part VII): the mind verbs run LAST (after every
          # amnesia-bomb cert, VII.0 #5) and before exit. LM-8 (Part IX): the
          # teach/ask now carry REAL WORDS. "sun"->"yellow" is the off-bias
          # pair (= the proven k*=2,v*=3 token ids: key word index 2 = "sun",
          # answer word index 3 = "yellow"): teacher_agree==100, pre_share
          # 0.0% at N=100 (printed by the teach itself — the in-log evidence).
          # `mind lang` runs the LM-9 capacity-v2/recall/oov/sensor-intact cert;
          # `sign test` runs the Ed25519 RFC-8032 KAT + provenance gates
          # (the KAT now also covers SEC-SIGN-TRUNC: oversize sign fail-CLOSED).
          # `drpc test` runs the SEC-OOB-DRPC cert (node id >= DNODE_MAX is
          # rejected at every drpc_call/dtk_* reach, no OOB dnode_table access).
          # timeout 720->900 (LM-9 Part X + LM-10 Part XI): the widened R_DM=48
          # substrate's shared s_pretrain is ~23s host (512 episodes x 80 epochs
          # — the in-context competence threshold), and r3/handoff/stream/lang/
          # teach each bootstrap it; `mind onemind` pretrains+consolidates several
          # times (the disease/cure measurement); plus `mind wait` ~15s nominal.
          timeout 900 sh -c "printf 'pfs\nhrw\nmoe test\ndkva test\nreflex test\nprotect test\ndtr gossip test\ndtr gossip g38\ndtr gossip ceiling\nr3 test\nhandoff test\nhandoff stream\nmind lang\nmind onemind\nmind nocentral\nmind wmerge\ndmn test\nself test\nsign test\ndrpc test\nmind teach sun yellow\nmind wait 120\nmind ask sun\nexit\n' | ./p-kernel" | tee selftest.log
          grep -aF '[pfs] PASS' selftest.log
          grep -aF '[hrw] PASS' selftest.log
          grep -aF '[hrw-l1] PASS' selftest.log
          # §7/§8 thought-core property tests (philosophy-gap-audit G3)
          grep -aF '[moe-nocentral] PASS' selftest.log
          grep -aF '[moe-twolayer] PASS' selftest.log
          grep -aF '[moe-osc] PASS' selftest.log
          grep -aF '[moe-concurrent] PASS' selftest.log
          # §2 G20: load/threat sign separation — rally, not flee (wave 13).
          # audit-4 acceptance #5: the green MUST be CI-enforced, not sim/doc-only.
          grep -aF '[moe-protect] PASS' selftest.log
          # 本丸 ONE BRAIN (wave 18): moe_infer's three brains unified onto one
          # dtr forward (docs/review-2026-06-three-brains.md). returned==routed
          # ==guarded from one forward; all 4 channels affect the gate (the
          # (void) discard is gone); the live path follows the learned dtr, not
          # ai_job.c's handwritten-constant MLP; and collective learning (G22)
          # now lifts the RETURNED accuracy (the brain the output never read).
          grep -aF '[onebrain-unified] PASS' selftest.log
          grep -aF '[onebrain-channels] PASS' selftest.log
          grep -aF '[onebrain-nomlp] PASS' selftest.log
          grep -aF '[onebrain-accuracy] PASS' selftest.log
          # §8 reflex closed loop + deliberation learning (closes audit G27:
          # the reflex self-test was previously never invoked in CI).
          grep -aF '[reflex-fb] PASS' selftest.log
          grep -aF '[reflex-learn] PASS' selftest.log
          # §8 G33 (gap-ledger): reflex THREAT LEVEL is driven by the observed
          # danger quantity, NOT a 5s wall-clock timer. It falls promptly on the
          # SAFE signal; persisting danger survives the clock passing HOLD; the
          # timeout remains only as a safety cap. (emitted by `reflex test`)
          grep -aF '[g33-controlled] PASS' selftest.log
          # §2 G28: threat grounded in under-replication + actuator closes the
          # loop (threat falls because of replication, not a timer; wave 14).
          grep -aF '[protect-ground] PASS' selftest.log
          grep -aF '[protect-loop] PASS' selftest.log
          # §2 ∧ §5 G35: MANY protected points defended IN PARALLEL — all reach
          # R replicas in ~one-point time (not N*), fair, none starves (wave 15).
          grep -aF '[plural-protect] PASS' selftest.log
          # §8/§9 G22 (wave 16): DECENTRALIZED COLLECTIVE LEARNING. Nodes on
          # DISJOINT (leave-one-class-out) shards each cap low on the full task
          # (shard-solo); gossip-averaging full weight bodies with NO central
          # aggregator lifts accuracy ABOVE that solo ceiling (gossip-learn);
          # the merge is peer-symmetric, no aggregator index (no-central).
          grep -aF '[g22-shard-solo] PASS' selftest.log
          grep -aF '[g22-gossip-learn] PASS' selftest.log
          grep -aF '[g22-no-central] PASS' selftest.log
          # §8/§9 G38 (wave 17): THINKING CHANGES GUARDING. The learned
          # transformer's REAL max-softmax confidence gates the reflex (was a
          # dead 0xFF that always fired = G34); a COLLECTIVELY-LEARNED model
          # guards measurably better than an UNLEARNED one; and the reflex's
          # per-class threat experience prioritizes the learning (two-layer
          # couple — audit-7 §4.3).
          grep -aF '[g38-confidence-live] PASS' selftest.log
          grep -aF '[g38-learning-improves-guarding] PASS' selftest.log
          grep -aF '[g38-guard-feeds-learning] PASS' selftest.log
          grep -aF '[g13-parallel] PASS' selftest.log
          # G13 (gap-ledger): cross-region inference is NOT gated by a fixed
          # blocking window. Aggregation finalizes on ARRIVAL (quorum_core, the
          # same predicate the live coordinator uses); the fixed window is a
          # straggler-only safety cap. N concurrent aggregations complete in
          # << N*window; the cap fires only for a never-arriving live member.
          grep -aF '[g13-arrival] PASS' selftest.log
          # R3 (non-trivial thought): in-context associative recall. The SAME
          # dtr kernels (dt_linear/dt_softmax/LayerNorm fwd+bwd) learn a function
          # no hand-written if can win at — the dictionary is resampled every
          # episode, so the best fixed rule is at chance + a bounded value-copy
          # edge (handif), random weights are chance (frozen), the analytic
          # backward grad-checks, and learned held-out beats both by >=30 pts.
          grep -aF '[r3-incontext-gradcheck] PASS' selftest.log
          grep -aF '[r3-incontext-frozen] PASS' selftest.log
          grep -aF '[r3-incontext-handif] PASS' selftest.log
          grep -aF '[r3-incontext-learned] PASS' selftest.log
          # G23 (gap-ledger): NODE CEILING > 32. DNODE_MAX 32->64; the gossip
          # merge + the REAL dnode_table membership fold both run across >32
          # (40) participants with no 32-cap (UMP "every install = a node").
          grep -aF '[g23-ceiling] PASS' selftest.log
          # living-mind first slice (docs/architecture/living-mind.md II): DMN
          # sleep-consolidation. A STREAM of region-shift/label-permuted tasks
          # is forgotten when learned naively (the disease is real, measured),
          # then CURED by replaying a bounded engram ring (B_RING << task data)
          # and distilling via the G22 no-central gl_merge -- task-0 retained
          # >= chance+30 and >= +25 over the no-replay baseline, newest task
          # still learned (plasticity). The merge is order-independent (no
          # central consolidator); engrams persist in p-fs and reconsolidate
          # after kill+rejoin; the replay path grad-checks. (`dmn test`)
          grep -aF '[dmn-forgetting] PASS' selftest.log
          grep -aF '[dmn-consolidated] PASS' selftest.log
          grep -aF '[dmn-distributed] PASS' selftest.log
          grep -aF '[dmn-survive] PASS' selftest.log
          grep -aF '[dmn-gradcheck] PASS' selftest.log
          # living-mind Part V (LM-4, the fast->slow handoff): a fact learned
          # ONLY in-context by R3's FAST layer (frozen rw[], the dictionary
          # lives in the prompt) is self-distilled into R3's OWN weights rw[]
          # via r_backward, so AFTER a sleep-consolidation round the mind
          # answers it WITHOUT the prompt; a scrambled-teacher control gives
          # no transfer (the gain traces to the real in-context reading).
          # (`handoff test`)
          grep -aF '[handoff-fast-only] PASS' selftest.log
          grep -aF '[handoff-consolidated] PASS' selftest.log
          grep -aF '[handoff-grounded] PASS' selftest.log
          # living-mind Part VI (LM-5, 随時 — the living consolidation loop): a
          # STREAM of facts taught in-context at different times is consolidated
          # into R3's own rw[] across MULTIPLE bounded sleep rounds via the SAME
          # r3_fact_learn/r3_consolidate_idle_round symbols the DMN idle hook
          # drives (dmn.c). Naive sequential consolidation destroys fact 1 (the
          # multi-fact disease, measured first); interleaved replay of retained
          # fact-engrams cures it (every fact answerable prompt-removed, newest
          # still lands); a scrambled-arrival stream transfers nothing; the fact
          # queue is budget-bounded with printed FIFO forgetting.
          # (`handoff stream`)
          grep -aF '[stream-interference] PASS' selftest.log
          grep -aF '[stream-consolidated] PASS' selftest.log
          grep -aF '[stream-grounded] PASS' selftest.log
          grep -aF '[stream-livehook] PASS' selftest.log
          # living-mind Part IX (LM-8, the language slice): REAL WORDS in,
          # one REAL WORD out. The widened substrate grad-checks; the
          # capacity curve (N real word-bindings vs masked recall, bar
          # DISCOVERED from the curve) holds; a specific binding round-trips
          # in words; OOV is refused, not guessed. (`mind lang`)
          grep -aF '[lang-gradcheck] PASS' selftest.log
          # LM-9 Part X: [lang-capacity] -> [lang-capacity-v2] (the R_DM 32->48
          # surgery; comfortable-N strictly > LM-8's 4) + the new safety gate
          # [lang-sensor-intact] (DTR_LN_MAXW 32->64 is FREE for the dtr sensor
          # brain — the onebrain/moe/dkva certs above stay byte-identical).
          grep -aF '[lang-capacity-v2] PASS' selftest.log
          grep -aF '[lang-recall] PASS' selftest.log
          grep -aF '[lang-oov] PASS' selftest.log
          grep -aF '[lang-sensor-intact] PASS' selftest.log
          # living-mind Part XI (LM-10, Path W — the one mind): the weight-states
          # converge. `mind onemind` MEASURES the disease (naive gl_merge of two
          # divergent minds -> the 2x2 node x fact matrix, classified (a)/(b)/(c))
          # and the cure (post-merge UNION replay of the retained engrams, the
          # LM-5 discipline). The MEASURED answer: plain averaging is LOSSY (one
          # fact collapses to ~chance — classification (c) PARTIAL), but the
          # union-replay cure recovers BOTH facts to 100% (the mind is ONE at the
          # substrate). `mind nocentral` proves the merge is order-independent at
          # n=R_NP (|fwd-rev| float-rounding only) + single-model identity. The
          # cross-node 84 KB chunk transport + survive-kill is the live job
          # (one-mind-live, samples/42_one_mind/run.sh).
          grep -aF '[onemind-divergent] PASS' selftest.log
          grep -aF '[onemind-cured] PASS' selftest.log
          grep -aF '[onemind-nocentral] PASS' selftest.log
          # living-mind Part XII (LM-11, Path W² — the weighted/Fisher merge):
          # `mind wmerge` MEASURES whether a SMARTER (diagonal-Fisher per-param)
          # merge beats the plain mean on the SAME divergent-minds matrix. It
          # prints BOTH 2x2 matrices (plain gl_merge vs gl_merge_w) + the per-
          # cell Δ + a WIN/TIE/LOSE verdict; the tags PASS on a valid MEASUREMENT
          # regardless of who wins (a TIE/LOSE is an honest shippable result, not
          # a failure). Fisher is REAL (Σrg² via r_backward over each node's OWN
          # retained engrams, F-LOCAL = zero extra wire). [wmerge-symmetric] is
          # the prior-quarantined control (no value 3x-favored in SDICT, XII.0
          # #4). gl_merge (the plain mean) is UNCHANGED and still drives LM-10
          # ([wmerge-noregress]); the weighted path is an additive sibling.
          grep -aF '[wmerge-vs-mean] PASS' selftest.log
          grep -aF '[wmerge-noreplay] PASS' selftest.log
          grep -aF '[wmerge-symmetric] PASS' selftest.log
          grep -aF '[wmerge-divergence] PASS' selftest.log
          grep -aF '[wmerge-nocentral] PASS' selftest.log
          grep -aF '[wmerge-noregress] PASS' selftest.log
          # living-mind Part IV (salience-weighted replay = the DMN's
          # imagination): under a FIXED replay budget (B_RING unchanged),
          # weighting the engram ring by EARNED salience (the per-class guard
          # experience reflex_threat_experience() that accrued from real reflex
          # firings) retains the high-salience (danger) class better than
          # uniform replay -- a real reallocation tradeoff measured on FRESH
          # held-out. salience EARNED not hand-set (gated precondition); the
          # uniform path is byte-identical when no danger met. (`dmn test`)
          grep -aF '[salience-earned] PASS' selftest.log
          grep -aF '[salience-retains] PASS' selftest.log
          grep -aF '[salience-noregress] PASS' selftest.log
          # living-mind Self layer (docs/architecture/living-mind.md III): a
          # distributed autobiographical self -- a per-node, hash-chained
          # "self/lin" lineage (LM_SELF_ENTRY versions, content-level walk via
          # pfs_id_compute, pfs_dag.c untouched) that (1) SURVIVES the node's
          # death and is continued by a successor (reconstructed hash-for-hash
          # from the persisted store after a RAM drop; successor seq==N+1 links
          # to the restored head), (2) is TAMPER-EVIDENT and fail-closed (a
          # one-byte flip moves the content-id; a forged splice is rejected;
          # a clean chain still verifies), and (3) reconstructs OWNERLESS from
          # a peer subset with the origin store emptied. Tamper-EVIDENT, not
          # tamper-proof (no signature primitive -- III.6). (`self test`)
          grep -aF '[self-continuity] PASS' selftest.log
          grep -aF '[self-tamperevident] PASS' selftest.log
          grep -aF '[self-ownerless] PASS' selftest.log
          # signing.md — Ed25519 provenance (RFC 8032 KAT-gated). A signature
          # attests an ARTIFACT came from a KEY, never a human (the §0 boundary).
          grep -aF '[sign-roundtrip] PASS' selftest.log
          grep -aF '[sign-selflayer] PASS' selftest.log
          grep -aF '[sign-unit] PASS' selftest.log
          grep -aF '[sign-keyrotation] PASS' selftest.log
          # SEC-OOB-DRPC (external audit 2026-06-13): node id >= DNODE_MAX is
          # rejected at every drpc_call/dtk_cre_tsk/dtk_sig_sem reach (no
          # out-of-bounds dnode_table[] access); a valid in-range id still flows.
          grep -aF '[drpc-oob] PASS' selftest.log
          # living-mind Part VII (LM-6, the mouth): the OWNER teaches the LIVE
          # mind at the shell — `mind teach 2 3` enqueues a singleton fact via
          # r3_fact_learn (frozen-teacher agree==100; pre_share<=33 = not
          # already in the weights); with NO further verbs the DMN task's OWN
          # idle pulses (real 1000ms heartbeat, real ACTIVE->IDLE) consolidate
          # it (`mind wait 120` only yields + polls; dmn-round delta >= 10
          # counted ONLY at the dmn.c hook site); `mind ask 2` then answers
          # from the weights on a MASKED prompt (share >= 75 vs pre <= 33).
          grep -aF '[teach-arrival] PASS' selftest.log
          grep -aF '[teach-live] PASS' selftest.log
          grep -aF '[teach-consolidated] PASS' selftest.log
          # the line this Part exists to make real: the PRODUCTION dmn idle
          # hook consolidated a conversational fact (it appears only if the
          # dmn task itself ran the round — never printed by cert-driven
          # direct calls).
          grep -aF '[dmn] sleep: distilled in-context facts -> rw[]' selftest.log
      # galaxy v1 (docs/architecture/galaxy.md §8): the observation window's
      # data-plane gate — curl-driven, non-flaky (end-state within a bound).
      # [galaxy-serve] (2-node mesh: me + ALIVE peer + embedded page),
      # [galaxy-events] (3-node FULL mesh: a remote drpc INFER produces a
      # matching SSE drpc_in), [galaxy-teach] (POST /teach -> drains via REAL
      # DMN pulses <=120s -> POST /ask returns the taught value, riding the
      # LM-6 mouth end-to-end through HTTP). Pixels are NOT certified (§7).
      # curl + python3 are already on ubuntu-latest.
      - name: Galaxy observation-window cert (galaxy.md §8)
        run: |
          timeout 300 samples/38_galaxy/galaxy_cert.sh | tee galaxy_cert.log
          grep -aF '[galaxy-serve] PASS'  galaxy_cert.log
          grep -aF '[galaxy-events] PASS' galaxy_cert.log
          grep -aF '[galaxy-teach] PASS'  galaxy_cert.log
      # ark-profile v1 (docs/architecture/ark-profile.md §8): 人類の記憶 — the
      # human chapter of the autobiography. curl-driven, non-flaky (end-state
      # within a bound). [ark-consent] (the 共感 gate: teach 403 before a
      # profile, served bytes hash == X-Manifesto-Id, ack-ONLY unlocks teach =
      # consent != disclosure, wrong-mid 409), [ark-profile] (the declaration
      # hash-verifies, is linked into self/lin via human_ref, survives a
      # restart on the same PKERNEL_PFS_DIR, edit-by-append -> pfs log len 2),
      # [ark-provenance] (web teach -> ARK_PROV src=1 + profile_head; shell
      # teach -> src=0; ONE write site, both mouths). NO identity verification
      # anywhere (§3.3). curl + python3 are already on ubuntu-latest.
      - name: Ark-profile human-chapter cert (ark-profile.md §8)
        run: |
          timeout 300 samples/39_ark_profile/profile_cert.sh | tee ark_profile_cert.log
          grep -aF '[ark-consent] PASS'    ark_profile_cert.log
          grep -aF '[ark-profile] PASS'    ark_profile_cert.log
          grep -aF '[ark-provenance] PASS' ark_profile_cert.log

      # i18n manifesto wave (ark-profile.md §7.5): the manifesto speaks many
      # languages and consent binds to the EXACT words READ. [i18n-manifesto]
      # — every embedded language serves with a self-consistent content-id
      # (sha256(served)==X-Manifesto-Id), the count is printed, a NON-ja
      # (Spanish) ack unlocks teach (the consent-id table works), a bogus
      # ?lang= falls back to en, and Accept-Language auto-defaults.
      - name: i18n manifesto cert (ark-profile.md §7.5)
        run: |
          timeout 300 samples/40_i18n_manifesto/i18n_cert.sh | tee i18n_cert.log
          grep -aF '[i18n-manifesto] PASS' i18n_cert.log

      # SLICE 0 — the durable layer stops lying (persistence.md; gap-ledger
      # DUR-SWALLOW 🔴 + DUR-REFTAB 🟠). [pfs-durswallow]: a failed durable
      # write makes pfs_put return NON-OK and pins the sole in-memory copy
      # un-evictable (FIFO no longer drops the only copy). [pfs-dagrefs]: a
      # same-length torn refs.tab is REFUSED at load (CRC32 over {count+
      # entries}) and a clean refs.tab round-trips. Both run against the real
      # pfs_put / refs_persist / pfs_dag_restore paths under PKERNEL_PFS_DIR.
      - name: Durable-honesty cert (persistence.md SLICE 0)
        run: |
          timeout 300 samples/43_dur_honest/dur_cert.sh | tee dur_honest_cert.log
          grep -aF '[pfs-durswallow] PASS' dur_honest_cert.log
          grep -aF '[pfs-dagrefs] PASS'    dur_honest_cert.log

      # persistence SLICE 1 + 2 (docs/architecture/persistence.md): the ark
      # REMEMBERS across an actual kill+restart on the same PKERNEL_PFS_DIR.
      # [persist-identity]: a shell-taught self/prov ref comes back byte-
      # identical via pfs_durable_restore + pfs_dag_restore. [persist-mind]:
      # sky->blue, the DMN persists rw[] after consolidation, reboot ->
      # `ask sky`->blue via the RESTORE path (no pretrain line). [persist-
      # mind-stale]: a header-corrupted blob is REFUSED (the wave-47 stale-
      # weights trap) -> lazy pretrain -> answer at chance, never blind-loaded.
      - name: Persistence cert (persistence.md SLICE 1 + SLICE 2)
        run: |
          timeout 800 samples/44_persist/persist_cert.sh | tee persist_cert.log
          grep -aF '[persist-identity] PASS'   persist_cert.log
          grep -aF '[persist-mind] PASS'       persist_cert.log
          grep -aF '[persist-mind-stale] PASS' persist_cert.log

      - name: selfc-ring3 immune boundary (the germ crash boundary, §5)
        run: |
          cd boot/linux_x86_64
          # selfc-ring3 v1 (docs/architecture/selfc-ring3.md): a self-built unit
          # runs in a fork()ed germ process where a crash is REAPED (waitpid)
          # instead of killing ./p-kernel. Run in its OWN ./p-kernel invocation,
          # LAST and isolated: `selfc test` proves post-crash liveness IN-BAND
          # (a sentinel T-Kernel tick advances AFTER the reap, §5.1), but the
          # process does NOT exit cleanly afterward — a fork/cooperative-
          # scheduler interaction wedges the idle loop once the gates printed
          # (KNOWN ISSUE, see the wave report). `timeout` reaps the wedge; the
          # three greppable gate verdicts are already in the log by then. This
          # needs libtcc-dev (installed above); without it selfc is a stub.
          #   [selfc-isolated]  DISEASE (a crash unit KILLS the node) -> CURE
          #                     (the same unit in a germ: reaped==1, WTERMSIG
          #                     ==SIGSEGV, sentinel alive)
          #   [selfc-rollback]  v2 dies in probation -> seq 2 BAD -> seq 1 serves
          #                     a fresh token again, deaths==1
          #   [selfc-lineage]   the version chain walks; self/lin events
          #                     hash-verify
          timeout 200 sh -c "printf 'selfc test\nexit\n' | ./p-kernel" | tee selfc.log || true
          grep -aF '[selfc-isolated] PASS' selfc.log
          grep -aF '[selfc-rollback] PASS' selfc.log
          grep -aF '[selfc-lineage] PASS' selfc.log

  ump-aarch64-cross:
    name: UMP aarch64 (cross-build on x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + qemu-user
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross: the hosted UMP build (_TK_HOSTED_LIBC_) needs
          # real aarch64 glibc headers; --no-install-recommends skips them and
          # the cross gcc falls back to the host's /usr/include and dies on
          # bits/libc-header-start.h. (Also pulls libc6-arm64-cross, which
          # provides /usr/aarch64-linux-gnu for the qemu-user -L below.)
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross make qemu-user-static
      - name: Cross-build (Makefile auto-selects aarch64-linux-gnu- off-host)
        run: make -C boot/linux
      - name: Verify artifact is aarch64
        run: file boot/linux/p-kernel | grep -F 'ARM aarch64'
      - name: Kernel self-tests under qemu-aarch64 (bonus, non-blocking)
        continue-on-error: true
        run: |
          cd boot/linux
          timeout 150 sh -c "printf 'pfs\nhrw\nmoe test\ndkva test\nreflex test\nprotect test\ndtr gossip test\ndtr gossip g38\ndtr gossip ceiling\nexit\n' | \
            qemu-aarch64-static -L /usr/aarch64-linux-gnu ./p-kernel" | tee selftest.log
          grep -aF '[pfs] PASS' selftest.log
          grep -aF '[hrw] PASS' selftest.log
          grep -aF '[hrw-l1] PASS' selftest.log
          grep -aF '[moe-nocentral] PASS' selftest.log
          grep -aF '[moe-twolayer] PASS' selftest.log
          grep -aF '[moe-osc] PASS' selftest.log
          grep -aF '[moe-concurrent] PASS' selftest.log
          grep -aF '[moe-protect] PASS' selftest.log
          # 本丸 ONE BRAIN (wave 18): three brains unified onto one dtr forward
          grep -aF '[onebrain-unified] PASS' selftest.log
          grep -aF '[onebrain-channels] PASS' selftest.log
          grep -aF '[onebrain-nomlp] PASS' selftest.log
          grep -aF '[onebrain-accuracy] PASS' selftest.log
          grep -aF '[reflex-fb] PASS' selftest.log
          grep -aF '[reflex-learn] PASS' selftest.log
          # §8 G33: reflex threat level driven by observed danger, not a timer
          grep -aF '[g33-controlled] PASS' selftest.log
          # §2 G28 grounded threat + closed loop (wave 14)
          grep -aF '[protect-ground] PASS' selftest.log
          grep -aF '[protect-loop] PASS' selftest.log
          # §2 ∧ §5 G35 plural parallel protection (wave 15)
          grep -aF '[plural-protect] PASS' selftest.log
          # §8/§9 G22 decentralized collective learning (wave 16)
          grep -aF '[g22-shard-solo] PASS' selftest.log
          grep -aF '[g22-gossip-learn] PASS' selftest.log
          grep -aF '[g22-no-central] PASS' selftest.log
          # §8/§9 G38 two-layer couple — thinking changes guarding (wave 17)
          grep -aF '[g38-confidence-live] PASS' selftest.log
          grep -aF '[g38-learning-improves-guarding] PASS' selftest.log
          grep -aF '[g38-guard-feeds-learning] PASS' selftest.log
          grep -aF '[g13-parallel] PASS' selftest.log
          # G13 cross-region inference not gated by a fixed window (arrival-driven)
          grep -aF '[g13-arrival] PASS' selftest.log
          # G23 node ceiling > 32 (gap-ledger): >32-participant gossip merge + fold
          grep -aF '[g23-ceiling] PASS' selftest.log


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p-kernel · galaxy</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#cdd6f4;
    font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #sky{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:12px;top:10px;font-size:12px;line-height:1.5;
    text-shadow:0 0 4px #000;pointer-events:none}
  #hud b{color:#89b4fa}
  #panel{position:fixed;right:0;top:0;height:100%;width:320px;max-width:80vw;
    background:rgba(10,12,20,.92);border-left:1px solid #1e2030;
    transform:translateX(100%);transition:transform .18s;padding:14px;
    box-sizing:border-box;font-size:12px;overflow:auto}
  #panel.open{transform:none}
  #panel h2{font-size:13px;color:#f9e2af;margin:.2em 0 .6em}
  #panel pre{white-space:pre-wrap;word-break:break-all;color:#a6adc8}
  #panel .x{position:absolute;right:10px;top:8px;cursor:pointer;color:#f38ba8}
  #ctl{position:fixed;left:12px;bottom:12px;font-size:12px}
  #ctl select,#ctl button{background:#181825;color:#cdd6f4;border:1px solid #313244;
    border-radius:4px;padding:3px 6px;font-family:inherit;margin-right:4px}
  #ctl button{cursor:pointer}
  #foot{position:fixed;right:12px;bottom:10px;font-size:11px;color:#6c7086;
    text-align:right;text-shadow:0 0 4px #000}
  #note{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);
    font-size:11px;color:#9399b2}
  /* ark-profile v1 first-run flow (ark-profile.md §7.4) — self-contained */
  #ark{position:fixed;inset:0;background:rgba(3,4,8,.96);z-index:50;
    display:none;align-items:center;justify-content:center}
  #ark.open{display:flex}
  #ark .card{max-width:680px;max-height:88vh;overflow:auto;margin:16px;
    background:#0a0c14;border:1px solid #1e2030;border-radius:8px;padding:22px;
    box-shadow:0 0 40px #000}
  #ark h1{font-size:16px;color:#f9e2af;margin:0 0 12px}
  #ark pre{white-space:pre-wrap;word-break:break-word;color:#cdd6f4;
    font-size:12px;line-height:1.6;background:#05060a;border:1px solid #181825;
    border-radius:6px;padding:12px;margin:0 0 14px}
  #ark .warn{color:#fab387;font-size:12px;line-height:1.6;margin:0 0 14px}
  #ark .warn b{color:#f38ba8}
  #ark .row{display:flex;gap:10px;margin:10px 0}
  #ark .row button{flex:1;padding:10px;border-radius:6px;cursor:pointer;
    border:1px solid #313244;background:#181825;color:#cdd6f4;
    font-family:inherit;font-size:13px}
  #ark .row button.primary{background:#1e2a3a;border-color:#89b4fa;color:#89b4fa}
  #ark label{display:block;font-size:11px;color:#9399b2;margin:10px 0 3px}
  #ark input,#ark textarea{width:100%;box-sizing:border-box;background:#05060a;
    color:#cdd6f4;border:1px solid #313244;border-radius:5px;padding:7px;
    font-family:inherit;font-size:12px}
  #ark textarea{height:70px;resize:vertical}
  #ark .opt{display:none}
  #ark .opt.open{display:block}
  #ark .tiny{font-size:11px;color:#6c7086;margin:6px 0 0}
  #ark .mid{font-size:10px;color:#45475a;word-break:break-all;margin-top:10px}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hud"></div>
<div id="note">this mind speaks 8 symbols today — it is an infant, truthfully shown</div>
<div id="ark"><div class="card">
  <h1 id="arkh">ようこそ — この銀河について</h1>
  <pre id="arktext">…</pre>
  <div class="warn" id="arkwarn">
    ここに書かれたものは <b>消せません</b>。内容アドレスで保存され、参加者の
    デバイスへ複製され、ノードの死を越えて生き残ります。<br>
    ・名前は自由です（本名・ペンネーム・匿名）。<b>誰もそれを検証しません。</b><br>
    ・何も書かずに立ち去っても、あなたのノードは完全に機能します。<br>
    ・<b>他人の情報を書かないでください。</b>
  </div>
  <div class="row" id="arkack">
    <button class="primary" id="arkagree">同意して刻む</button>
    <button id="arkdecline">今はやめておく</button>
  </div>
  <div class="opt" id="arkfields">
    <label>ハンドル / 名乗り（任意・ペンネーム可・検証されません）</label>
    <input id="arkhandle" maxlength="24" placeholder="任意">
    <label>未来への言葉（任意・他人の情報は書かないでください）</label>
    <textarea id="arkmsg" maxlength="1024" placeholder="任意"></textarea>
    <label>本名（任意・折りたたみ）</label>
    <input id="arkname" maxlength="48" placeholder="任意">
    <div class="row">
      <button class="primary" id="arksave">星に名前を灯す</button>
      <button id="arkskip">名乗らず同意だけ</button>
    </div>
    <div class="tiny">過去の版は消えません。新しい版が追加されるだけです。</div>
  </div>
  <div class="mid" id="arkmid"></div>
</div></div>
<div id="ctl">
  teach k<select id="tk"></select> v<select id="tv"></select>
  <button id="bteach">teach</button>
  &nbsp; ask k<select id="ak"></select>
  <button id="bask">ask</button>
  <span id="msg" style="color:#a6e3a1"></span>
</div>
<div id="foot"></div>
<div id="panel"><span class="x" onclick="closePanel()">close</span>
  <h2 id="ptitle"></h2><pre id="pbody"></pre></div>
<script>
"use strict";
// ── ALL data is REAL, from THIS node's /galaxy.json + /events. No fake
//    stars, no decorative nebulae (galaxy.md §5 sparse-galaxy stance).
const cv=document.getElementById("sky"),ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener("resize",resize);resize();

let snap={me:{id:0},peers:[],dropped:0};
let dreaming=false;              // EV_DMN_IDLE state (galaxy.md §5)
const flashes=[];                // transient rays/ripples
const orbiters=[];               // taught fact-particles awaiting consolidation
let t0=performance.now();

// deterministic per-node placement around my star (no god-view).
function pos(id){
  if(id===snap.me.id) return {x:W/2,y:H/2};
  const a=(id*2.39996323),r=Math.min(W,H)*0.30*(0.5+((id*97)%100)/200);
  return {x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r};
}
const STATE=["UNKNOWN","ALIVE","SUSPECT","DEAD"];
function stateColor(st,threat){
  if(st===3) return "#45475a";           // DEAD husk
  if(st===2) return "#f9e2af";           // SUSPECT flicker
  const hue=200-(threat||0)*1.6;         // threat red-shift
  return `hsl(${hue},70%,65%)`;
}

function draw(){
  const now=performance.now(),tms=now-t0;
  ctx.clearRect(0,0,W,H);
  // gossip threads = drawn only for flashes (real events), §5
  for(const f of flashes){
    const age=now-f.t, life=f.kind==="ripple"?1400:900;
    if(age>life){continue;}
    const al=1-age/life;
    const a=pos(f.src||snap.me.id), b=pos(f.dst!=null?f.dst:snap.me.id);
    ctx.strokeStyle=`rgba(${f.rgb},${al*0.8})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    if(f.kind==="ripple"){
      const me=pos(snap.me.id);ctx.strokeStyle=`rgba(${f.rgb},${al})`;
      ctx.beginPath();ctx.arc(me.x,me.y,40+age/14,0,7);ctx.stroke();
    }
  }
  flashes.splice(0,flashes.length,...flashes.filter(f=>now-f.t<1500));

  // peer stars (real membership)
  for(const p of snap.peers){
    if(p.state===0) continue;            // UNKNOWN = not drawn (§5)
    const q=pos(p.id);
    let r=4+(100-(p.pressure<0?50:p.pressure))/22;   // brightness ~ spare cap
    let col=stateColor(p.state,p.threat);
    let al=1;
    if(p.state===2) al=0.4+0.4*Math.abs(Math.sin(tms/200));   // flicker
    if(p.state===3) al=0.30;
    if(p.fresh>9000) al*=0.45;           // stale = faded (古さの尊重)
    ctx.globalAlpha=al;ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(q.x,q.y,r,0,7);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle="#9399b2";ctx.font="10px monospace";
    ctx.fillText("node"+p.id+(p.fresh>9000?" (stale "+Math.round(p.fresh/1000)+"s)":""),q.x+r+3,q.y+3);
  }

  // my star — center; breathing pulse iff literally dreaming
  const me=pos(snap.me.id);
  let mr=10, pulse=1;
  if(dreaming) pulse=0.6+0.4*Math.abs(Math.sin(tms/700));   // slow breath
  ctx.fillStyle=dreaming?"#94e2d5":"#89b4fa";
  ctx.globalAlpha=pulse;
  ctx.beginPath();ctx.arc(me.x,me.y,mr+(dreaming?6*(1-pulse):0),0,7);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle="#f5e0dc";ctx.font="12px monospace";
  ctx.fillText((snap.me.star?("★ "+snap.me.star):("★ ME (node"+snap.me.id+")"))+(dreaming?" — dreaming":""),me.x+mr+5,me.y+4);

  // orbiting taught fact-particles (real pending engrams)
  for(const o of orbiters){
    const a=tms/600+o.ph, rr=34;
    const x=me.x+Math.cos(a)*rr, y=me.y+Math.sin(a)*rr*0.6;
    ctx.fillStyle="#fab387";ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
    ctx.fillStyle="#9399b2";ctx.fillText("k"+o.k+"="+o.v,x+5,y);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function flash(kind,src,dst,rgb){flashes.push({kind,src,dst,rgb,t:performance.now()});}

// ── SSE: every photon is a real event (galaxy.md §1) ──────────────
function connectEvents(){
  const es=new EventSource("/events");
  es.onmessage=(e)=>{
    let v;try{v=JSON.parse(e.data);}catch(_){return;}
    switch(v.type){
      case "dmn_idle": dreaming=true; break;
      case "dmn_wake": dreaming=false; break;
      case "teach": orbiters.push({k:v.a,v:v.b,ph:Math.random()*6}); break;
      case "consolidate": orbiters.shift(); break;   // a particle sinks in
      case "ask": flash("ray",snap.me.id,null,"203,166,247"); break;
      case "drpc_in": flash("ripple",v.src,snap.me.id,"166,227,161"); break;
      case "drpc_out": flash("ray",snap.me.id,v.dst,"137,180,250"); break;
      case "moe": flash("ray",snap.me.id,v.dst,"249,226,175"); break;
      case "swim": break;   // membership reflected by /galaxy.json snapshot
    }
  };
  es.onerror=()=>{};   // EventSource auto-reconnects
}
connectEvents();

// ── 1 Hz snapshot ────────────────────────────────────────────────
async function poll(){
  try{
    const r=await fetch("/galaxy.json");snap=await r.json();
    const m=snap.me;
    document.getElementById("hud").innerHTML=
      `<b>node ${m.id}</b> · region ${m.region} · dmn ${m.dmn===1?"IDLE (dreaming)":"ACTIVE"}`+
      `<br>pending facts: ${m.pending} · lifetime sleep-rounds: ${m.rounds}`+
      `<br>pressure ${m.pressure} · threat ${m.threat} · dropped events ${snap.dropped}`;
    document.getElementById("foot").innerHTML=
      `this is node ${m.id}'s view — gossip-bounded · peers known: ${snap.peers.filter(p=>p.state>0).length}`;
    dreaming=(m.dmn===1);
    // keep orbiter count honest with real pending
    while(orbiters.length>m.pending) orbiters.pop();
  }catch(_){}
}
setInterval(poll,1000);poll();

// ── pickers ──────────────────────────────────────────────────────
function fill(id,n){const s=document.getElementById(id);
  for(let i=0;i<n;i++){const o=document.createElement("option");o.value=i;o.text=i;s.add(o);}}
fill("tk",8);fill("tv",4);fill("ak",8);
function msg(t,ok){const m=document.getElementById("msg");
  m.style.color=ok?"#a6e3a1":"#f38ba8";m.textContent=t;
  setTimeout(()=>{m.textContent="";},4000);}
async function postForm(path,body){
  const r=await fetch(path,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  return r.json();
}
document.getElementById("bteach").onclick=async()=>{
  const k=tk.value,v=tv.value;
  try{
    const r=await fetch("/teach",{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`k=${k}&v=${v}`});
    if(r.status===403){ msg("まず、この銀河について読んでください",false); arkOpen(); return; }
    const j=await r.json();
    msg(j.ok?`taught k=${k} v=${v} (queued, pending ${j.pending}) — watch it sink`:"teach refused",j.ok);
  }catch(_){msg("teach failed",false);}
};
document.getElementById("bask").onclick=async()=>{
  const k=ak.value;
  try{const j=await postForm("/ask",`k=${k}`);
    msg(`ask k=${k} -> pred ${j.pred} (share ${(j.share/10).toFixed(1)}%)`,true);}
  catch(_){msg("ask failed",false);}
};

// ── ark-profile v1 first-run flow (ark-profile.md §7.4) ───────────
//    manifesto -> ack -> optional disclosure -> your star gains its name.
//    Self-contained: served bytes + id come from THIS node's /manifesto.
let arkMid=null;
async function arkLoadManifesto(){
  const r=await fetch("/manifesto");
  arkMid=r.headers.get("X-Manifesto-Id");
  const txt=await r.text();
  document.getElementById("arktext").textContent=txt;
  document.getElementById("arkmid").textContent="manifesto-id "+(arkMid||"?");
}
function arkOpen(){
  document.getElementById("arkfields").classList.remove("open");
  document.getElementById("arkack").style.display="";
  if(!arkMid){ arkLoadManifesto(); }
  document.getElementById("ark").classList.add("open");
}
function arkClose(){ document.getElementById("ark").classList.remove("open"); }
window.arkOpen=arkOpen;
document.getElementById("arkdecline").onclick=()=>{ arkClose(); };  // node fully works
document.getElementById("arkagree").onclick=()=>{
  // consent recorded only on a successful POST /profile; first reveal fields.
  document.getElementById("arkack").style.display="none";
  document.getElementById("arkfields").classList.add("open");
};
async function arkSubmit(withFields){
  if(!arkMid){ await arkLoadManifesto(); }
  let body="ack=1&mid="+encodeURIComponent(arkMid);
  if(withFields){
    const h=document.getElementById("arkhandle").value.trim();
    const m=document.getElementById("arkmsg").value;
    const n=document.getElementById("arkname").value.trim();
    if(h) body+="&handle="+encodeURIComponent(h);
    if(m) body+="&msg="+encodeURIComponent(m);
    if(n) body+="&name="+encodeURIComponent(n);
  }
  try{
    const r=await fetch("/profile",{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
    const j=await r.json();
    if(j.ok){ arkClose(); poll();   // your star gains its name (real state change)
      msg(withFields?"星に名前が灯りました":"同意を刻みました",true);
    } else {
      // mid changed since load -> re-ask with the new text (consent to words)
      msg("確認テキストが更新されました。もう一度お読みください",false);
      arkMid=j.manifesto_id||null; arkLoadManifesto();
      document.getElementById("arkfields").classList.remove("open");
      document.getElementById("arkack").style.display="";
    }
  }catch(_){ msg("profile failed",false); }
}
document.getElementById("arksave").onclick=()=>arkSubmit(true);
document.getElementById("arkskip").onclick=()=>arkSubmit(false);
// first-run trigger: a node with no profile yet dims and rises the manifesto.
async function arkFirstRun(){
  try{ const j=await (await fetch("/profile.json")).json();
    if(j && j.none){ await arkLoadManifesto(); arkOpen(); }
  }catch(_){}
}
arkFirstRun();

// ── click a star -> /self.json (mine) or peer world-row ───────────
async function openSelf(){
  const r=await fetch("/self.json");const j=await r.json();
  document.getElementById("ptitle").textContent="self/lin — my autobiography";
  let body = j.present
      ? `self_id ${j.self_id}\nseq     ${j.seq}\nhash    ${j.hash}\nprev    ${j.prev}\n`
      : "no committed self lineage yet on this node.";
  if(j.present && j.human){
    body += `\n—— 人類の記憶 (the human chapter) ——\n`;
    if(j.human.named){
      if(j.human.handle) body += `handle  ${j.human.handle}\n`;
      if(j.human.name)   body += `name    ${j.human.name}\n`;
    } else {
      body += `名もなき同意 (consent without disclosure)\n`;
    }
    if(j.human.msg) body += `\n未来への言葉:\n${j.human.msg}\n`;
    body += `prof_seq ${j.human.prof_seq}\n`;
  }
  if(j.present) body += `\n改竄検出可・偽造不可ではない（署名は未実装）`;
  document.getElementById("pbody").textContent = body;
  document.getElementById("panel").classList.add("open");
}
function openPeer(p){
  document.getElementById("ptitle").textContent="node"+p.id+" — as gossiped";
  document.getElementById("pbody").textContent=
    `state    ${STATE[p.state]}\nregion   ${p.region}\ndevice   ${p.device}\n`+
    `pressure ${p.pressure}\nthreat   ${p.threat}\nat-risk  ${p.atrisk}\n`+
    `as gossiped ${Math.round(p.fresh/1000)}s ago`;
  document.getElementById("panel").classList.add("open");
}
function closePanel(){document.getElementById("panel").classList.remove("open");}
window.closePanel=closePanel;
cv.addEventListener("click",(e)=>{
  const me=pos(snap.me.id);
  if(Math.hypot(e.clientX-me.x,e.clientY-me.y)<22){openSelf();return;}
  for(const p of snap.peers){if(p.state===0)continue;const q=pos(p.id);
    if(Math.hypot(e.clientX-q.x,e.clientY-q.y)<14){openPeer(p);return;}}
});
</script>
</body>
</html>

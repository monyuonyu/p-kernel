<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yurikago · galaxy</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#cdd6f4;
    font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #sky{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:12px;top:10px;font-size:13px;line-height:1.6;
    text-shadow:0 0 4px #000;pointer-events:auto;
    max-width:calc(100vw - 195px)}   /* leave room for #lang (top-right) */
  #hud b{color:#89b4fa}
  #panel{position:fixed;right:0;top:0;height:100%;width:320px;max-width:80vw;
    background:rgba(10,12,20,.92);border-left:1px solid #1e2030;
    transform:translateX(100%);transition:transform .18s;padding:14px;
    box-sizing:border-box;font-size:12px;overflow:auto}
  #panel.open{transform:none}
  #panel h2{font-size:13px;color:#f9e2af;margin:.2em 0 .6em}
  #panel pre{white-space:pre-wrap;word-break:break-all;color:#a6adc8}
  #panel .x{position:absolute;right:10px;top:8px;cursor:pointer;color:#f38ba8}
  /* bottom dock: ONE fixed column holding note -> ctl -> foot, so the
     three never overlap (wave-47 mobile fix). On desktop it sits bottom-
     left and is content-width; on a phone the media query makes it span
     full width and the ctl bar wraps. The star canvas stays full-bleed
     behind it; the dock only catches pointer events on its controls. */
  #dock{position:fixed;left:12px;bottom:10px;z-index:30;
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    max-width:calc(100vw - 24px);box-sizing:border-box;pointer-events:none}
  #dock>*{pointer-events:auto}
  /* control bar: a small WRAPPING flex bar holding the talk + log buttons
     (step ⑥ removed the word->word teach/ask inputs). Translucent backing. */
  #ctl{font-size:14px;display:flex;flex-wrap:wrap;align-items:center;
    gap:6px 4px;max-width:100%;box-sizing:border-box;
    background:rgba(10,12,20,.82);border:1px solid #1e2030;border-radius:8px;
    padding:8px 10px}
  #ctl select,#ctl button{background:#181825;color:#cdd6f4;border:1px solid #313244;
    border-radius:4px;padding:4px 8px;font-family:inherit;font-size:14px}
  #ctl button{cursor:pointer}
  #ctl #msg{flex-basis:100%;font-size:12px}   /* status drops to its own line */
  #foot{font-size:11px;color:#6c7086;text-shadow:0 0 4px #000;
    pointer-events:none}
  #note{font-size:11px;color:#9399b2;text-shadow:0 0 4px #000;
    pointer-events:none}
  /* phones / narrow WebViews: full-width dock. */
  @media (max-width:640px){
    #dock{left:8px;right:8px;bottom:8px;max-width:none}
  }
  /* ── chat panel (wave-chat-ws-ui): a scrolling column of user/mind
     bubbles over the galaxy canvas, with a bottom input+send bar. It is a
     bottom sheet anchored to the dock so the calm default view (the sky) is
     never covered until the owner opens it. The canvas + #ctl + #ark all
     stay intact; this is purely additive. Mobile-friendly per the 412x915
     dock — full width on a phone, comfortable max-width on desktop. */
  #chat{position:fixed;left:12px;right:auto;bottom:10px;z-index:35;
    width:min(420px,calc(100vw - 24px));max-width:calc(100vw - 24px);
    box-sizing:border-box;display:none;flex-direction:column;
    background:rgba(8,10,18,.92);border:1px solid #1e2030;border-radius:10px;
    box-shadow:0 0 40px rgba(0,0,0,.6);overflow:hidden}
  #chat.open{display:flex}
  #chatbar{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid #181825;
    color:#f9e2af;font-size:12px}
  #chatbar .x{cursor:pointer;color:#f38ba8;font-size:12px;padding:2px 4px}
  #chatconn{font-size:10px;color:#6c7086}
  #chatlog{flex:1;min-height:120px;max-height:48vh;overflow-y:auto;
    padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:82%;padding:7px 11px;border-radius:12px;font-size:13px;
    line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .bub.me{align-self:flex-end;background:#1e2a3a;color:#cbe1ff;
    border:1px solid #2b3b52;border-bottom-right-radius:4px}
  .bub.mind{align-self:flex-start;background:#15161f;color:#cdd6f4;
    border:1px solid #1e2030;border-bottom-left-radius:4px}
  .bub.sys{align-self:center;background:transparent;color:#6c7086;
    font-size:11px;padding:2px 6px;max-width:92%;text-align:center}
  .bub.err{align-self:flex-start;background:#2a1620;color:#f38ba8;
    border:1px solid #3a2030;border-bottom-left-radius:4px}
  /* typing indicator while awaiting {type:"tok"} frames — a quiet pulse, no
     fake "thinking" theatrics, just an honest "the baby is composing". */
  .bub.mind.think{color:#6c7086;font-style:italic;animation:thinkpulse 1.4s ease-in-out infinite}
  @keyframes thinkpulse{0%,100%{opacity:.45}50%{opacity:.9}}
  /* the empty-state hint at the top of an empty conversation */
  .bub.sys.chatempty{font-style:italic;line-height:1.6;max-width:88%}
  #chatform{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #181825;
    box-sizing:border-box}
  #chatin{flex:1;min-width:0;font-size:16px;background:#181825;color:#cdd6f4;
    border:1px solid #313244;border-radius:8px;padding:8px 10px;
    font-family:inherit}   /* >=16px: no Android focus-zoom */
  #chatsend{background:#1e2a3a;color:#89b4fa;border:1px solid #89b4fa;
    border-radius:8px;padding:8px 14px;font-family:inherit;font-size:14px;
    cursor:pointer;flex:0 0 auto}
  #chatsend:active{transform:translateY(1px)}
  /* the dock button that opens the chat sheet */
  #ctl #btalk{border-color:#45475a}
  @media (max-width:640px){
    #chat{left:8px;right:8px;width:auto;max-width:none}
    #chatlog{max-height:42vh}
  }
  /* i18n: top-right language selector (ark-profile.md §7.5) */
  #lang{position:fixed;right:12px;top:10px;z-index:40;font-size:12px}
  #lang select{background:#181825;color:#cdd6f4;border:1px solid #313244;
    border-radius:4px;padding:3px 6px;font-family:inherit}
  /* ark-profile v1 first-run flow (ark-profile.md §7.4) — self-contained */
  #ark{position:fixed;inset:0;background:rgba(3,4,8,.96);z-index:50;
    display:none;align-items:center;justify-content:center}
  #ark.open{display:flex}
  #ark .card{max-width:680px;max-height:88vh;overflow:auto;margin:16px;
    background:#0a0c14;border:1px solid #1e2030;border-radius:8px;padding:22px;
    box-shadow:0 0 40px #000}
  #ark h1{font-size:16px;color:#f9e2af;margin:0 0 12px}
  #ark pre{white-space:pre-wrap;word-break:break-word;color:#cdd6f4;
    font-size:12px;line-height:1.6;background:#05060a;border:1px solid #181825;
    border-radius:6px;padding:12px;margin:0 0 14px}
  #ark .warn{color:#fab387;font-size:12px;line-height:1.6;margin:0 0 14px}
  #ark .warn b{color:#f38ba8}
  #ark .row{display:flex;gap:10px;margin:10px 0}
  #ark .row button{flex:1;padding:10px;border-radius:6px;cursor:pointer;
    border:1px solid #313244;background:#181825;color:#cdd6f4;
    font-family:inherit;font-size:13px}
  #ark .row button.primary{background:#1e2a3a;border-color:#89b4fa;color:#89b4fa}
  #ark label{display:block;font-size:11px;color:#9399b2;margin:10px 0 3px}
  #ark input,#ark textarea{width:100%;box-sizing:border-box;background:#05060a;
    color:#cdd6f4;border:1px solid #313244;border-radius:5px;padding:7px;
    font-family:inherit;font-size:12px}
  #ark textarea{height:70px;resize:vertical}
  #ark .opt{display:none}
  #ark .opt.open{display:block}
  #ark .tiny{font-size:11px;color:#6c7086;margin:6px 0 0}
  #ark .mid{font-size:10px;color:#45475a;word-break:break-all;margin-top:10px}
  /* log overlay (copy-log button) — selectable textarea, mobile-safe */
  #logov{position:fixed;inset:0;background:rgba(3,4,8,.96);z-index:55;
    display:none;align-items:center;justify-content:center}
  #logov.open{display:flex}
  #logov .logcard{display:flex;flex-direction:column;width:680px;max-width:92vw;
    height:80vh;max-height:88vh;margin:16px;background:#0a0c14;
    border:1px solid #1e2030;border-radius:8px;padding:14px;box-shadow:0 0 40px #000}
  #logov .logbar{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:8px;color:#f9e2af;font-size:13px}
  #logov .logbar button{background:#181825;color:#cdd6f4;border:1px solid #313244;
    border-radius:4px;padding:4px 8px;font-family:inherit;font-size:12px;
    cursor:pointer;margin-left:6px}
  #logtext{flex:1;width:100%;box-sizing:border-box;background:#05060a;
    color:#a6adc8;border:1px solid #181825;border-radius:6px;padding:10px;
    font-family:inherit;font-size:11px;line-height:1.5;resize:none;
    white-space:pre;overflow:auto}
  #loghint{font-size:10px;color:#6c7086;margin-top:8px;line-height:1.5}
  /* ── illustrated intro (0.5.0) — a 3-page swipeable onboarding that
     leads INTO the #ark consent gate. Self-contained: every picture is
     inline SVG/canvas in the galaxy palette, NO external assets, offline.
     Sits above the sky, below #ark (which opens on top when the user
     advances past the last page). */
  #intro{position:fixed;inset:0;z-index:48;display:none;
    background:radial-gradient(120% 90% at 50% 18%,#0a0e1c 0%,#05060a 62%);
    flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;touch-action:pan-y}
  #intro.open{display:flex}
  #introtrack{position:relative;width:100%;flex:1;overflow:hidden}
  #introtrack .pg{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:32px 26px;box-sizing:border-box;gap:18px;
    opacity:0;transform:translateX(40px) scale(.98);
    transition:opacity .5s ease,transform .5s ease;pointer-events:none}
  #introtrack .pg.live{opacity:1;transform:none;pointer-events:auto}
  #introtrack .pg.past{opacity:0;transform:translateX(-40px) scale(.98)}
  #intro .art{width:min(72vw,300px);height:min(72vw,300px);max-height:42vh;
    flex:0 0 auto}
  #intro .ttl{font-size:clamp(19px,5.6vw,26px);color:#f5e0dc;font-weight:600;
    line-height:1.35;letter-spacing:.01em;
    font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans",sans-serif;
    text-shadow:0 0 18px rgba(137,180,250,.25)}
  #intro .sub{font-size:clamp(13px,3.6vw,15px);color:#a6adc8;line-height:1.7;
    max-width:22em;
    font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans",sans-serif}
  /* the consent page = the FINAL step of the onboarding (wave-intro-integrate).
     It hosts the SAME #ark .card (manifesto + ack), just mounted inside the
     intro frame so the read-and-consent reads as one flow with the pictures.
     It is taller and top-aligned (the manifesto scrolls), not art-centred. */
  #introtrack .pg.consent{justify-content:flex-start;padding:18px 14px;gap:0}
  #intromount{width:100%;display:flex;align-items:flex-start;
    justify-content:center;flex:1;min-height:0}
  #intromount .card{margin:0}
  /* bottom controls: dots + next/begin button */
  #introbar{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    gap:16px;padding:8px 0 max(26px,env(safe-area-inset-bottom))}
  #introdots{display:flex;gap:9px}
  #introdots span{width:8px;height:8px;border-radius:50%;background:#313244;
    transition:background .3s,transform .3s;cursor:pointer}
  #introdots span.on{background:#89b4fa;transform:scale(1.25);
    box-shadow:0 0 10px #89b4fa}
  #intronext{min-width:200px;padding:13px 26px;border-radius:999px;
    border:1px solid #89b4fa;background:#1e2a3a;color:#cbe1ff;
    font-size:15px;cursor:pointer;letter-spacing:.02em;
    font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans",sans-serif;
    box-shadow:0 0 22px rgba(137,180,250,.28)}
  #intronext:active{transform:translateY(1px)}
  #introskip{position:fixed;top:max(12px,env(safe-area-inset-top));
    right:14px;z-index:49;font-size:12px;color:#6c7086;cursor:pointer;
    background:rgba(10,12,20,.5);border:1px solid #1e2030;border-radius:999px;
    padding:6px 13px;
    font-family:-apple-system,system-ui,"Hiragino Sans","Noto Sans",sans-serif}
  #introskip:active{color:#cdd6f4}
  /* small corner control to re-view the intro later (lives on the galaxy).
     Sits just under the top-right language selector so it never collides
     with the top-left human HUD (which can wrap onto a 2nd line). */
  #reintro{position:fixed;right:14px;top:40px;z-index:39;font-size:15px;
    color:#45475a;cursor:pointer;text-shadow:0 0 6px #000;user-select:none;
    display:none;line-height:1}
  #reintro:hover{color:#89b4fa}
  @media (max-width:640px){
    #intro .ttl{margin-top:6px}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="lang"><select id="langsel" title="language"></select></div>
<div id="hud"></div>
<div id="ark"><div class="card">
  <h1 id="arkh">…</h1>
  <pre id="arktext">…</pre>
  <div class="warn" id="arkwarn"></div>
  <div class="row" id="arkack">
    <button class="primary" id="arkagree">…</button>
    <button id="arkdecline">…</button>
  </div>
  <div class="opt" id="arkfields">
    <label id="lblhandle">…</label>
    <input id="arkhandle" maxlength="24">
    <label id="lblmsg">…</label>
    <textarea id="arkmsg" maxlength="1024"></textarea>
    <label id="lblname">…</label>
    <input id="arkname" maxlength="48">
    <div class="row">
      <button class="primary" id="arksave">…</button>
      <button id="arkskip">…</button>
    </div>
    <div class="tiny" id="arkappend">…</div>
  </div>
  <div class="mid" id="arkmid"></div>
</div></div>
<!-- illustrated intro (0.5.0): shows on first run, leads INTO #ark above.
     Pictures are inline SVG drawn by buildIntro(); skip + re-view supported. -->
<div id="intro">
  <div id="introskip">…</div>
  <div id="introtrack"></div>
  <div id="introbar">
    <div id="introdots"></div>
    <button id="intronext">…</button>
  </div>
</div>
<div id="reintro" title="intro">&#9432;</div>
<!-- bottom dock: note -> ctl -> foot in ONE column so they never overlap
     (wave-47 mobile fix). The canvas stays full-bleed behind it. -->
<div id="dock">
  <div id="note">A young mind lives here — still learning to speak.</div>
  <!-- step ⑥: the old word->word teach/ask inputs were removed. The student
       is now spoken to in free text via the conversation sheet (the talk
       button below). Only the talk + log controls remain on the dock. -->
  <div id="ctl">
    <button id="btalk" title="talk with this star">&#128172; talk</button>
    <button id="blog" title="copy this node's recent log">&#128203; log</button>
    <span id="msg" style="color:#a6e3a1"></span>
  </div>
  <div id="foot"></div>
</div>
<!-- chat sheet (wave-chat-student-ui, step ⑥): a claude.ai-style scrolling
     conversation with the resident STUDENT — a growing baby. The owner types
     free text; the student's reply streams in token-by-token ({type:"tok"}
     frames, finalized by {type:"done"}). Opened by the dock's talk button;
     the calm default galaxy view stays the sky until then. Messages travel
     over the live WS ({"t":"chat","text":...}); a read-only SSE fallback
     keeps the star alive but cannot carry the conversation upstream. The old
     word->word teach/ask toy and its "that word isn't known" refusals were
     removed — this is just conversation now. -->
<div id="chat">
  <div id="chatbar">
    <span id="chatttl">talk with your star</span>
    <span>
      <span id="chatconn"></span>
      <span class="x" id="chatclose">close</span>
    </span>
  </div>
  <div id="chatlog"></div>
  <form id="chatform" autocomplete="off">
    <input id="chatin" maxlength="240" placeholder="say something">
    <button id="chatsend" type="submit">send</button>
  </form>
</div>
<!-- log overlay: a selectable textarea so a phone user can always long-
     press-select even if both clipboard APIs are refused (http WebView). -->
<div id="logov"><div class="logcard">
  <div class="logbar">
    <span id="logttl">node log</span>
    <span>
      <button id="logcopy">&#128203; copy</button>
      <button id="logclose">close</button>
    </span>
  </div>
  <textarea id="logtext" readonly></textarea>
  <div id="loghint"></div>
</div></div>
<div id="panel"><span class="x" onclick="closePanel()">close</span>
  <h2 id="ptitle"></h2><pre id="pbody"></pre></div>
<script>
"use strict";
// ── i18n (ark-profile.md §7.5) ────────────────────────────────────
//    UI chrome strings per language; the MANIFESTO itself is served
//    per-language by the node (/manifesto?lang=xx) — never duplicated
//    here. Missing keys fall back to en. The star field needs no words.
//    COVERAGE: all 32 manifesto languages, full key set (no en fallback
//    on a non-en device). Edit translations in tools/galaxy/i18n_data.py
//    and re-splice with tools/galaxy/build_i18n.py (json.dumps escaping).
//    HONESTY: en + ja are the human-reviewed originals. All other
//    languages' short functional strings are MACHINE-TRANSLATED (same
//    discipline as ui_strings.tsv) — native review is welcome and
//    expected; corrections are one-line edits in i18n_data.py.
//    Keys — ark chrome: title agree decline save skip lblhandle lblmsg
//          lblname append optional teach ask mustread consentmark namemark
//          updated profilefail; HUD chrome: st_dream st_learn st_link
//          st_alone st_awake notew word btnteach btnask btnlog teachok
//          teachfail askpre detail logttl logcopy logclose logok logng;
//          intro: intro_skip intro_next intro_begin intro_t1 intro_s1
//          intro_t2 intro_s2 intro_t3 intro_s3 intro_t4 intro_s4 reintro.
const I18N = {

// pick the best available code for a BCP-47 tag (exact, then primary subtag).
function bestLang(tag){
  if(!tag) return null;
  tag=String(tag);
  const lower=s=>String(s).toLowerCase();
  for(const c in LANGS) if(lower(c)===lower(tag)) return c;          // exact
  const prim=tag.split(/[-_]/)[0];
  // exact primary-subtag among table codes WITHOUT a subtag
  for(const c in LANGS) if(c.indexOf("-")<0 && lower(c)===lower(prim)) return c;
  return null;
}

// ── dolly zoom: camD is the live camera distance (wheel + pinch move it).

const CAM_MIN=100, CAM_MAX=2200;   // (was 180) deeper dolly: mk_pino もう少しズーム
// ── IMMERSION dolly (living-body-inspector.md): below CAM_MIN you keep going,
//    INTO the body. CAM_INNER is the deepest seat — the camera sits among the
//    organ shells. The membrane (drawMeBlob) fades, the body clip is released,
//    and the organs switch from screen-space rings to genuine WORLD coords via
//    project(). rev_inner ∈ [0,1] crossfades that transition (0 at CAM_SURFACE,
//    1 at CAM_INNER). Guard: the outermost organ world radius Rw_max ≤ ME_WORLD_R
//    (=190) < FOV+CAM_INNER (=520-286=234), so the far shell stays IN FRONT of
//    the camera at full penetration; a per-point cull (zc=FOV+Zrot+camD<=8) drops
//    anything behind/through the camera (replaces the old global CAM_MIN clamp).
const CAM_SURFACE=140, CAM_INNER=-286;   // start piercing / deepest seat
const ME_WORLD_R=190;                     // outermost organ world radius (Rw_max)
// rev_inner: 0 above CAM_SURFACE (screen-space interior), 1 at/below CAM_INNER
// (full world-space immersion). A pure function of the LIVE camera distance —
// not of tms — so freezing the snapshot never moves it.
function revInner(){
  if(camD>=CAM_SURFACE) return 0;
  if(camD<=CAM_INNER)   return 1;

}
// dolly math (verify, mk_pino 0.8.x deeper-zoom): the ME star sits at world Z=0,
// so its projection denominator is FOV+Z+camD = 520+0+100 = 620 at full dolly —
// safely > 0 (never inverts through / past the origin star). The raw geometric
// perspective factor praw = (FOV+CAMD)/(FOV+CAM_MIN) = 1380/620 ≈ 2.226 (was
// 1.971 at CAM_MIN=180). After the me-star super-linear gain in drawSelf
// (pscale = 1+(praw-1)*(1+0.85*(praw-1))) the MAX pscale is now ≈ 3.50 (was
// ≈ 2.77) — the organs fill noticeably more of the screen at full zoom.
let camD=CAMD, camDTarget=CAMD;  // current + eased target distance
// the projection scale `s` the ME star (world origin, Z=0) gets at the DEFAULT
// distance. We normalise the me-star's perspective growth by this so the calm
// default view is byte-for-byte today's look (factor==1 at camD==CAMD), and it
// only grows/shrinks as you actually dolly. Without this the me-star was drawn
// at a FIXED pixel size and zoom moved the camera but never enlarged the star

// ── ME-star undulating blob ─────────────────────────────────────────────
//   The owner's own star is NOT a rigid scaling circle: its OUTLINE ripples
//   like a water droplet / jellyfish. The shape = a closed path of NB points
//   whose radius is baseR*(1 + Σ small sine lobes) at angular freqs 2/3/5
//   with fixed phase offsets, travelling around the rim over the clock — a
//   deterministic function of (clock, state), NEVER Math.random (product-soul
//   honest-growth law). meStarState supplies wspeed/wamp/wlobe so the motion
//   is driven by the mind's REAL mode (dream slow&large / learn quick&fine /
//   calm shimmer / stress agitated). Drawn by clipping the path and blitting
//   the cached sphere sprite (no per-frame gradient) so it still reads 3D.
const NB=28;                                   // outline points (smooth, cheap)
// three travelling lobes: [angular frequency, weight, phase offset]. The
// weights sum the deformation; freqs 2,3,5 give an organic non-repeating edge.
// This is the CALM baseline (mk_pino's "今すごく良い"): a gentle smooth
// undulation. It is NEVER weakened — stress only LAYERS extra irregular motion
// ON TOP of it (ME_AMEBA below), so at real S_n=0 the star == today's look.
const ME_LOBES=[[2,0.55,0.0],[3,0.30,2.1],[5,0.15,4.7]];
// ── stress-driven amoeba irregularity (interoception.md §3.3/§3.4) ──────────
//   A STRESSED star (real S_n>0) stops being a clean droplet and becomes
//   restless / spiky / amoeba-like. We get that from a SECOND bank of higher,
//   incommensurate spatial frequencies (7/11/17 — no common period, so the
//   edge never repeats: reads as organic noise, not a tidy sine) that travel
//   faster than the calm band (a stressed edge jitters). Cheap: same Σ-sin
//   pattern, summed only when stress warrants. The whole bank is multiplied by
//   `stress` in drawMeBlob, so at S_n=0 every amoeba term is exactly 0 and the
//   shape collapses to ME_LOBES (today's calm). NO Math.random (product-soul
//   honest-growth law): deterministic function of (clock, real state).
const ME_AMEBA=[[7,0.42,1.0,1.7],[11,0.30,3.3,2.6],[17,0.20,5.1,3.9]];
//                ^angFreq ^weight ^phase ^timeRateMul (× wspeed, ×4 below)
const ME_TWO_PI=6.28318530718;
// scratch arrays reused every frame (no per-frame allocation)
const _bx=new Float32Array(NB), _by=new Float32Array(NB);
function drawMeBlob(cx,cy,baseR,spr,al,tms,ms,throb){
  // 1) deform the outline. Each lobe travels around the rim at wspeed*freq.
  const amp=ms.wamp+0.9*throb*ms.wamp;          // a real SSE beat = a brief swell
  // amoeba strength = the REAL S_n (ms.stress in [0,1], from pressure+threat —
  // the SAME signal that red-shifts the hue, so wobble and colour move together
  // honestly). 0 => no extra motion (calm baseline preserved exactly). It rises
  // super-linearly so a faint stress barely perturbs, a high stress clearly
  // agitates — a continuous slope, never a jump (§3.4 oscillation guard). The
  // amoeba displacement is a fraction of the calm lobe depth (amp), so it
  // scales with the star.
  const s=ms.stress||0;
  const ameba=amp*s*(0.55+0.85*s);              // 0 at s=0; ~1.4*amp at s=1
  let rmax=0;
  for(let i=0;i<NB;i++){
    const a=i/NB*ME_TWO_PI;
    let d=0;
    for(let l=0;l<ME_LOBES.length;l++){
      const f=ME_LOBES[l][0]*ms.wlobe;           // state scales how many lobes
      d+=ME_LOBES[l][1]*Math.sin(f*a + tms*ms.wspeed*ME_LOBES[l][0] + ME_LOBES[l][2]);
    }
    // amoeba band: high-freq, faster-travelling, ONLY when stressed.
    let g=0;
    if(ameba>0){
      for(let l=0;l<ME_AMEBA.length;l++){
        g+=ME_AMEBA[l][1]*Math.sin(ME_AMEBA[l][0]*a
              + tms*ms.wspeed*ME_AMEBA[l][3]*4.0 + ME_AMEBA[l][2]);
      }
    }
    const r=baseR*(1+amp*d+ameba*g);
    _bx[i]=cx+Math.cos(a)*r; _by[i]=cy+Math.sin(a)*r;
    const rr=baseR*(1+amp*Math.abs(d)+ameba*Math.abs(g)); if(rr>rmax) rmax=rr;
  }

  //    a soft blob, not a spiky polygon) — one path, cheap.
  ctx.beginPath();

  ctx.moveTo(px,py);
  for(let i=0;i<NB;i++){
    const j=(i+1)%NB;
    const mx=(_bx[i]+_bx[j])/2, my=(_by[i]+_by[j])/2;
    ctx.quadraticCurveTo(_bx[i],_by[i],mx,my);
  }
  ctx.closePath();
  // 3) fill it with the 3D look: clip to the wobbling outline, blit the cached
  //    sphere sprite (bright off-centre core -> shaded rim). NO per-frame
  //    gradient; the sprite is pre-rendered once per palette colour.
  ctx.save();
  ctx.clip();

    // its size/brightness follow the beat (honest), never tms. Skip entirely if
    // every vertex of this ring was culled (lblZbest stayed at its 2 sentinel) so
    // we never draw a bead/label at a stale anchor from a previous organ.
    const visible=(lblZbest<2);
    if(visible){
      ctx.globalAlpha=baseA*0.95+0.3*g.beat;
      ctx.fillStyle=`rgba(${rgb},1)`;
      ctx.beginPath();ctx.arc(_lblX[i],_lblY[i],Math.max(1.4,baseR*0.03)*(1+0.4*g.beat),0,7);ctx.fill();
    }
    if(reveal>0.5 && visible){
      _lblTxt[i]=g.txt; _lblAbbr[i]=o.abbr; _lblRGB[i]=rgb;
      if(_lblZ[i]<nearestZ){ nearestZ=_lblZ[i]; nearestLbl=i; }
    }else{
      _lblTxt[i]=""; _lblAbbr[i]="";          // culled ring: no label this frame
    }
  }
  // the inference nucleus (NOT a shell): a central heartbeat tinted by the last
  // decision. Resting infer rate 0 ⇒ no pulse (only the shimmer). Its label takes
  // the extra (ME_ORGANS.length) slot.
  const ni=ME_ORGANS.length;
  const nuc=nucleusGlow(m,now,tms);
  ctx.globalAlpha=reveal*(0.45+0.5*nuc.beat);
  ctx.fillStyle=`rgba(${nuc.tint},1)`;
  ctx.beginPath();ctx.arc(cx,cy,Math.max(2,baseR*0.05)*(1+0.6*nuc.beat),0,7);ctx.fill();
  if(reveal>0.5){ _lblX[ni]=cx; _lblY[ni]=cy; _lblTxt[ni]=nuc.txt; _lblAbbr[ni]="◉";
                  _lblRGB[ni]=nuc.tint; _lblZ[ni]=0.5; _lblN=ni+1; }
  else _lblN=ni;
  ctx.restore();   // release clip BEFORE the billboarded labels (screen-space text)
  // ── billboarded metric labels (screen-space, NEVER rotated) — the in-body
  //    task-manager readout. Drawn last, unclipped, so text stays crisp. To stop
  //    the overlap mk_pino saw on the phone, only the NEAREST ring shows its full
  //    metric line; every other ring shows just a small colour-coded abbr tag at
  //    its own anchor. Tag boxes are nudged off the bead by a short leader so the
  //    text never sits on the glow. Smaller font + DPR-aware sizing keep it legible
  //    on the 412×915 dock.
  if(reveal>0.5 && baseR>16){
    const la=(reveal-0.5)*2*0.9;
    const big=Math.max(10,Math.min(13,baseR*0.06));   // focused-label px
    const sm=Math.max(8,big-2);                        // abbr tag px
    for(let i=0;i<_lblN;i++){
      if(!_lblTxt[i]) continue;
      const focused=(i===nearestLbl);
      const txt=focused?_lblTxt[i]:_lblAbbr[i];
      if(!txt) continue;
      ctx.font=(focused?big:sm)+"px ui-monospace,monospace";
      const ox=_lblX[i]+6, oy=_lblY[i]-2;              // anchor just off the bead
      const tw=ctx.measureText(txt).width;
      const fh=focused?big+3:sm+2;
      ctx.globalAlpha=la*(focused?0.62:0.42);          // dark backing for contrast
      ctx.fillStyle="rgba(5,6,10,0.72)";
      ctx.fillRect(ox-2,oy-fh+2,tw+4,fh);
      ctx.globalAlpha=la*(focused?1:0.85);
      ctx.fillStyle=`rgba(${_lblRGB[i]},1)`;
      ctx.fillText(txt,ox,oy);
    }
  }
  ctx.globalAlpha=1;
}

// ── VITALS: browser-side rate differencing (living-body-inspector.md) ───────
//    The kernel emits monotone COUNTERS (idle_runs, infer_count, lineage,
//    facts_learned, epoch); rates are NOT in the snapshot. We difference
//    successive honest snaps against WALLCLOCK dt to get idle_runs/min and
//    infer/s — the "task-manager graph" feel with no kernel rate counter and
//    no per-frame allocation. CORE LAW: every derived motion comes from a value
//    that REALLY changed between two reads; freezing the poll freezes all of
//    this to zero. Counters can also reset (node restart) — a negative delta is
//    clamped to 0 (a restart is not a burst of activity).
//    Fixed-size ring buffers (preallocated) feed the sparklines; the only
//    writes are wrap-around index stores — allocation-free forever.
const SPARK_N=48;
const _inferHist=new Float32Array(SPARK_N);   // infer/s history (ring)
const _stressHist=new Float32Array(SPARK_N);  // S_n history (ring)
let _sparkHead=0, _sparkFilled=0;
const VIT={
  // last raw counter reads + the wallclock they were read at
  t:0, idle:0, infer:0, lineage:0, facts:0, ep:0,
  // smoothed derived rates (EWMA so the sparkline/ring read steadily, not jumpy)
  idleRate:0,        // idle_runs per MINUTE
  inferRate:0,       // inferences per SECOND
  // smoothed fleet-internal axes (wave-intro-biometric): pressure/threat are
  // REAL but, on a solo phone, step in coarse jumps (compute_pressure adds ~12
  // per firing sensor class) that read as "random 50 then 44". EWMA-eased here
  // for the LEGIBILITY of the system line ONLY — the value still settles to the
  // true snapshot (a frozen poll converges to it), so it stays honest. The
  // organ glow keeps reading the raw stress via meStarState (unchanged).
  loadSm:0,          // EWMA of m.pressure
  threatSm:0,        // EWMA of m.threat
  vHave:false,       // baseline captured for loadSm/threatSm
  lineageBeat:-1e9,  // wallclock of the last REAL lineage tick (drives self pulse)
  factsBeat:-1e9,    // wallclock of the last REAL facts_learned rise (R3 flicker)
  inferBeat:-1e9,    // wallclock of the last REAL infer_count rise (nucleus pulse)
  lastSnap:-1e9,     // wallclock of the last successful poll (freshness gate)
  have:false         // a baseline has been captured
};
// fold one honest snapshot into VIT. Called ONLY from poll() (real 1Hz read),
// never from draw(), so the rates are a pure function of real snapshots + the
// wallclock between them — exactly the falsifiability contract.
function vitUpdate(m){
  const now=performance.now();
  const idle=m.idle_runs|0, infer=m.infer_count|0, lin=m.lineage|0,
        fac=m.facts_learned|0, ep=m.epoch|0;
  if(VIT.have){
    const dt=(now-VIT.t)/1000;                 // seconds since last real snap
    if(dt>0.05){
      const dIdle=Math.max(0,idle-VIT.idle);    // clamp restarts to 0
      const dInfer=Math.max(0,infer-VIT.infer);
      const a=0.5;                              // EWMA weight (steady, honest)
      VIT.idleRate +=a*((dIdle/dt*60)-VIT.idleRate);
      VIT.inferRate+=a*((dInfer/dt)   -VIT.inferRate);
      if(lin>VIT.lineage) VIT.lineageBeat=now;  // a real self-DAG tick
      if(fac>VIT.facts)   VIT.factsBeat=now;    // a real retained-fact rise
      if(idle>VIT.idle)   _dmnBeatAt=now;       // a real consolidation run ticked
      if(infer>VIT.infer) VIT.inferBeat=now;    // a real inference happened
    }
  }
  VIT.t=now; VIT.idle=idle; VIT.infer=infer; VIT.lineage=lin;
  VIT.facts=fac; VIT.ep=ep; VIT.lastSnap=now; VIT.have=true;
  // ease the two fleet-internal axes for the legible system line (honest: first
  // read seeds exactly, then EWMA so a 50->44 step glides instead of flicking).
  const pr=m.pressure|0, th=m.threat|0;
  if(!VIT.vHave){ VIT.loadSm=pr; VIT.threatSm=th; VIT.vHave=true; }
  else{ VIT.loadSm+=(pr-VIT.loadSm)*0.2; VIT.threatSm+=(th-VIT.threatSm)*0.2; }
  // push the two task-manager traces (ring, no allocation)
  _inferHist[_sparkHead]=VIT.inferRate;
  _stressHist[_sparkHead]=meStarState(m).stress;
  _sparkHead=(_sparkHead+1)%SPARK_N;
  if(_sparkFilled<SPARK_N) _sparkFilled++;
}
// snapshot freshness in [0,1]: 1 right after a poll, decaying to 0 if polling
// STOPS (the falsifiability test: freeze the snapshot). Any continuous (tms-
// driven) organ motion — the R3 training strobe, the nucleus oscillation — is
// multiplied by this, so a frozen snapshot kills all of it within ~2.5s and the
// interior goes static save the ≤4% shimmer. A pure read of VIT.lastSnap.
function snapFresh(){
  const a=(performance.now()-VIT.lastSnap)/2500;
  return a<=0?1:a>=1?0:1-a;
}

// ── ME-star living state -> {glow sprite, sphere sprite, pulse cadence}.
//    Derived from the SAME snapshot fields the HUD reads (poll(): m.pending,
//    m.dmn, m.pressure, m.threat) so the visual NEVER disagrees with the
//    "your star is dreaming/learning/…" words. Calm is the honest default.
//    interoception.md §3.3: 穏やか=低脈動の青寄り, しんどい=速い脈動の赤寄り.
function meStarState(m){
  m=m||{};
  // stress in [0,1] from MY real pressure+threat (the only S_n inputs
  // /galaxy.json exposes for ME today; atrisk is peers-only). EWMA-smoothed
  // upstream in the kernel; here a gentle blend, no fake source.
  const stress=Math.min(1,((m.pressure||0)+(m.threat||0)*1.4)/120);
  let mode,sprGlow,sprBall,period,depth,rgb;
  // wobble = the SHAPE-undulation character (interoception §3.3): how fast the
  //   outline ripples (wspeed), how deep the lobes push (wamp, as a fraction of
  //   radius), and how many travelling lobes dominate (wlobe ~ angular freq).
  let wspeed,wamp,wlobe;
  if((m.pending||0)>0){            // LEARNING (== HUD st_learn) — gold, quick fine ripples
    mode="learn"; sprGlow=GLOW.gold; sprBall=SPHERE.gold; rgb=ME_RGB.gold;
    period=820;  depth=0.34; wspeed=0.0019; wamp=0.085; wlobe=1.30;   // quick & fine
  }else if((m.dmn||0)===1){        // DREAMING (== HUD st_dream) — indigo, slow deep swell
    mode="dream"; sprGlow=GLOW.indigo; sprBall=SPHERE.indigo; rgb=ME_RGB.indigo;
    period=2600; depth=0.42; wspeed=0.0008; wamp=0.130; wlobe=0.80;   // slow & large
  }else{                           // CALM AWAKE — warm white, near-still shimmer
    mode="calm"; sprGlow=GLOW.white; sprBall=SPHERE.white; rgb=ME_RGB.white;
    period=3400; depth=0.16; wspeed=0.0006; wamp=0.055; wlobe=0.90;   // gentle shimmer
  }
  // stress overlay: faster + agitated + reddish, proportional (not a jump).
  // §3.4 oscillation guard: continuous slope, never "stressed => max".
  if(stress>0.04){
    period*=(1-0.45*stress);                       // up to ~2x faster
    depth =Math.min(0.55,depth+0.18*stress);       // a little more agitated
    wspeed*=(1+1.4*stress);                         // edge ripples faster
    wamp  =Math.min(0.20,wamp+0.07*stress);         // a little more pronounced wobble
    if(stress>0.20){ sprGlow=GLOW.red; sprBall=SPHERE.red; rgb=ME_RGB.red; }  // red-shift
  }
  return {mode,sprGlow,sprBall,rgb,period,depth,stress,wspeed,wamp,wlobe};
}

// ambient sky: a tilted galactic band + a thin sphere shell. Generated once,
// deterministic enough to feel stable; carries NO data (see header comment).
const BG=[];
(function(){
  let seed=42;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<560;i++){
    const band=i<280;let x,y,z;
    if(band){ const a=rnd()*6.2832, r=260+rnd()*900;
      x=Math.cos(a)*r; z=Math.sin(a)*r; y=(rnd()-0.5)*80+x*0.20; }
    else{ const a=rnd()*6.2832, b=Math.acos(2*rnd()-1), r=380+rnd()*820;
      x=r*Math.sin(b)*Math.cos(a); y=r*Math.cos(b)*0.7; z=r*Math.sin(b)*Math.sin(a); }
    const tint=rnd();
    BG.push({x,y,z,m:0.35+rnd()*0.9,tw:rnd()*7,
      c:tint<0.72?"205,214,244":tint<0.84?"137,180,250":tint<0.94?"249,226,175":"245,194,231"});
  }
})();

// real-node placement: angle deterministic by id; DISTANCE is the living
// signal — stress-as-distance (interoception.md §3.3). Until /intero.json
// ships, the SWIM RTT EWMA (peers[].rtt) is the proximity proxy: a calm,
// near peer orbits close; unknown/far drifts to the rim. S_n slots in here.
const ORBIT_TILT=0.55, OT_S=Math.sin(ORBIT_TILT), OT_C=Math.cos(ORBIT_TILT);
function peerWorld(p){
  const a=p.id*2.39996323;                    // golden-angle spread
  const rtt=(p.rtt>0)?p.rtt:520;              // 0 = unmeasured -> far
  const d=130+Math.min(520,rtt*1.5);
  const wob=Math.sin(p.id*1.7)*40;            // slight per-star plane offset
  return {x:Math.cos(a)*d,
          y:Math.sin(a)*d*OT_S*0.45+wob*0.3,
          z:Math.sin(a)*d*OT_C};
}
const STATE=["UNKNOWN","ALIVE","SUSPECT","DEAD"];
function stateColor(st,threat){
  if(st===3) return "#45475a";           // DEAD husk
  if(st===2) return "#f9e2af";           // SUSPECT flicker
  const hue=200-(threat||0)*1.6;         // threat red-shift
  return `hsl(${hue},70%,65%)`;
}
// screen-position cache for hit-testing (filled per-frame by draw)
const HIT={me:{x:0,y:0,r:18},peers:{}};

let rafOn=true;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ rafOn=false; }
  else if(!rafOn){ rafOn=true; requestAnimationFrame(draw); }
});

function draw(){
  if(!rafOn) return;
  const now=performance.now(),tms=now-t0;
  if(!dragging){ yawUser+=vyaw; vyaw*=0.94; }        // inertia after a fling
  yaw=tms*0.000055+yawUser;              // slow drift + the owner's hand
  // ease the camera dolly + focus-pan toward their targets (smooth zoom).
  camD+=(camDTarget-camD)*0.18;
  panX+=(panXTarget-panX)*0.12; panY+=(panYTarget-panY)*0.12;
  CP=Math.cos(pitchCur); SP=Math.sin(pitchCur);
  ctx.clearRect(0,0,W,H);

  // ① ambient depth field (parallax = the 3D feel)
  for(const s of BG){
    const q=project(s.x,s.y,s.z);
    if(q.s<=0.18) continue;
    const tw=0.55+0.45*Math.sin(tms/900+s.tw);
    const r=s.m*q.s*2.2;
    ctx.globalAlpha=Math.min(0.9,0.22+q.s*1.05)*tw*0.85;
    ctx.fillStyle=`rgb(${s.c})`;
    ctx.beginPath();ctx.arc(q.x,q.y,Math.max(0.4,r),0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ② project the real nodes (sorted far→near so glows layer correctly)
  const me3=project(0,0,0);
  const drawables=[];
  for(const p of snap.peers){
    if(p.state===0) continue;            // UNKNOWN = not drawn (§5)
    const w=peerWorld(p),q=project(w.x,w.y,w.z);
    drawables.push({p,q});
  }
  drawables.sort((a,b)=>b.q.z-a.q.z);

  // ③ connection threads: me -> each known peer (the fleet is a constellation;
  //    line strength fades with staleness — gossip keeps the thread warm)
  for(const d of drawables){
    const p=d.p,q=d.q;
    let al=(p.state===3)?0.06:0.22;
    if(p.fresh>9000) al*=0.45;
    const grad=ctx.createLinearGradient(me3.x,me3.y,q.x,q.y);
    grad.addColorStop(0,`rgba(137,180,250,${al})`);
    grad.addColorStop(1,`rgba(205,214,244,${al*0.4})`);
    ctx.strokeStyle=grad;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(me3.x,me3.y);ctx.lineTo(q.x,q.y);ctx.stroke();
  }

  // ④ gossip flashes = real events only, §5 (drawn over the idle threads)
  for(const f of flashes){
    const age=now-f.t, life=f.kind==="ripple"?1400:900;
    if(age>life) continue;
    const al=1-age/life;
    const pa=f.src!=null&&f.src!==snap.me.id?HIT.peers[f.src]:HIT.me;
    const pb=f.dst!=null&&f.dst!==snap.me.id?HIT.peers[f.dst]:HIT.me;
    const a=pa||HIT.me,b=pb||HIT.me;
    ctx.strokeStyle=`rgba(${f.rgb},${al*0.85})`;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    if(f.kind==="ripple"){
      ctx.strokeStyle=`rgba(${f.rgb},${al})`;
      ctx.beginPath();ctx.arc(HIT.me.x,HIT.me.y,40+age/14,0,7);ctx.stroke();
    }
  }
  flashes.splice(0,flashes.length,...flashes.filter(f=>now-f.t<1500));

  // ⑤ peer stars (far→near)
  const newHit={};
  for(const d of drawables){
    const p=d.p,q=d.q;
    let r=(4+(100-(p.pressure<0?50:p.pressure))/22)*q.s*1.4;
    let col=stateColor(p.state,p.threat);
    let al=Math.min(1,0.35+q.s*0.75);
    if(p.state===2) al*=0.4+0.4*Math.abs(Math.sin(tms/200));   // flicker
    if(p.state===3) al*=0.32;
    if(p.fresh>9000) al*=0.45;           // stale = faded (古さの尊重)
    const spr=(p.state===3)?GLOW.white:(p.threat>30?GLOW.red:GLOW.blue);
    glowAt(spr,q.x,q.y,r*3.2,al*0.5);
    // peers get the subtler sphere look too (3D ball, no pulse — the focus
    // is the ME star). DEAD husks / SUSPECT flicker keep their flat fill so
    // the state semantics (faded husk, blinking) stay legible.
    if(p.state===1){
      const bspr=(p.threat>30)?SPHERE.red:SPHERE.blue;
      sphereAt(bspr,q.x,q.y,r,al);
    }else{
      ctx.globalAlpha=al;ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(q.x,q.y,r,0,7);ctx.fill();
    }
    ctx.globalAlpha=Math.min(1,al+0.2);ctx.fillStyle="#9399b2";
    ctx.font=`${Math.max(9,Math.round(10*q.s+2))}px monospace`;
    ctx.fillText("node"+p.id+(p.fresh>9000?" (stale "+Math.round(p.fresh/1000)+"s)":""),q.x+r+4,q.y+3);
    ctx.globalAlpha=1;
    newHit[p.id]={x:q.x,y:q.y,r:Math.max(12,r+6)};
  }
  HIT.peers=newHit;

  // ⑥ my star — the origin: a small LIVING SPHERE that pulses to the mind's
  //    REAL state. Mode/colour/cadence come from meStarState(snap.me) (the
  //    same dmn/pending/pressure/threat the HUD reads). The pulse is a real
  //    clock (tms) shaped by that state; a heartbeat throb is layered ONLY
  //    when a real SSE event fired beat(). 火ではなく木: gentle, smooth.
  const ms=meStarState(snap.me);
  // steady breathing pulse in [1-depth, 1], eased (cosine, no hard edges)
  const phase=(tms%ms.period)/ms.period;            // 0..1
  const breath=0.5-0.5*Math.cos(phase*6.28318);     // 0..1 smooth
  let pulse=1-ms.depth+ms.depth*breath;
  // event heartbeat: a brief throb on a genuine event, decays ~900ms, added
  // OVER the idle pulse (so an idle star never throbs). 0 unless beat() ran.
  const hAge=now-heartTime;
  let throb=0;
  if(hAge>=0 && hAge<900){
    const k=1-hAge/900;                              // linear fade
    throb=heartMag*k*k*Math.sin(Math.min(hAge/130,3.14159)); // one soft thump
  }
  // PERSPECTIVE SCALE: the me-star sits at the world origin, so project(0,0,0)
  // already returns a valid scale me3.s that grows as the camera dollies in
  // (camD↓ => s↑). The old code threw this away and used a fixed mr=11, so
  // zooming never enlarged your own star. Normalise by ME_S0 so the calm
  // default view (camD==CAMD) is unchanged (pscale==1), and the star genuinely
  // approaches/fills the screen as you zoom in. Clamp the low end so a fully
  // zoomed-OUT star never vanishes to a sub-pixel speck.
  //   The raw geometric factor (me3.s/ME_S0) maxes at ~1.97x at full dolly
  //   (origin star, CAM_MIN). That alone reads as "a bit bigger", not "I flew
  //   right up to it". So past the default view we add a gentle super-linear
  //   gain (only for the ME star, which is the UX focus) so a full zoom-in
  //   genuinely FILLS more of the screen — while pscale stays exactly 1 at the
  //   default distance (the calm look is untouched). Monotonic, no jump.
  const praw=Math.max(0.35,me3.s/ME_S0);
  const pscale=(praw<=1)?praw:1+(praw-1)*(1+0.85*(praw-1));   // ==1 at default
  const mr=11*pscale;
  const glowR1=mr*6*(1+0.10*(pulse-0.7)+0.5*throb);
  const glowR2=mr*2.6*(1+0.06*(pulse-0.7)+0.3*throb);
  glowAt(ms.sprGlow,me3.x,me3.y,glowR1,(0.30+0.18*ms.stress)*pulse+0.35*throb);
  glowAt(ms.sprGlow,me3.x,me3.y,glowR2,(0.70)*pulse+0.25*throb);
  // the body itself: an UNDULATING droplet, not a scaled circle. The breathing
  // scale (pulse/throb) stays as a SUBTLE size component; the headline motion
  // is the rippling OUTLINE from drawMeBlob (a deterministic function of the
  // clock + meStarState's wspeed/wamp/wlobe — real mind state, no random).
  // baseR carries the perspective (mr) so the amoeba deformation, which is a
  // *fraction* of baseR, scales WITH the zoom and keeps deforming at every
  // distance (drag-rotate + amoeba both keep working up close).
  const ballR=mr*(1+0.10*(pulse-0.7)+0.45*throb);
  // IMMERSION crossfade: rev_inner (0=surface, 1=inside the body). As you pierce
  // the membrane the drawMeBlob OUTLINE fades to nothing (revI→1) so you go
  // THROUGH it rather than clipping against a wall. revI is a pure function of
  // the live camera distance — never tms — so a frozen snapshot keeps it fixed.
  const revI=revInner();
  ME_VIT.peers=drawables.length;            // alive constellation -> Collective shell
  drawMeBlob(me3.x,me3.y,ballR,ms.sprBall,Math.min(1,0.9*pulse+0.3*throb)*(1-revI),tms,ms,throb);
  // ── INTERIOR HOOK: when you've dollied right up to your own star (pscale past
  //   a proximity threshold) we stop reading it as just a bigger blob and begin
  //   revealing what's INSIDE — groundwork toward mk_pino's dream
  //   「本当ならその星の中の臓器まで見えると面白い」. The "organs" are meant to map
  //   to the mind's real modules / observability (see meStarInterior below):
  //   the DMN (dream consolidation), the R3 weights, the engram ring, the
  //   self-lineage, the relay links — each an internal structure with its own
  //   live state. For now this is a real, performant placeholder layer: faint
  //   concentric "organ" rings drawn INSIDE the blob, fading in with proximity,
  //   plus an 内部 (interior) label, so the zoom-into-a-star gesture leads
  //   somewhere instead of dead-ending at a large droplet.
  if(pscale>INTERIOR_AT || revI>0){
    meStarInterior(me3.x,me3.y,ballR,pscale,ms,tms,snap.me,revI);
  }
  ctx.fillStyle="#f5e0dc";ctx.font="12px monospace";
  ctx.fillText((snap.me.star?("★ "+snap.me.star):("★ ME (node"+snap.me.id+")"))
               +(ms.mode==="dream"?" — dreaming":ms.mode==="learn"?" — learning":""),

}

// ── event dispatch: every photon is a real event (galaxy.md §1).
//    ONE dispatch(v) is shared by BOTH transports — the WebSocket (primary)
//    and the EventSource SSE (fallback) — so the star renders identically no
//    matter which channel delivered the frame. The kernel emits the SAME JSON
//    event objects on either. Over the WS the kernel ALSO streams the
//    student's conversational reply as {type:"tok"} / {type:"done"} frames
//    (see chatTok/chatDone); those are routed here so the one dispatch stays
//    the single entry point.
function dispatch(v){
  if(!v || typeof v!=="object") return;
  switch(v.type){
    // reflect the dream transition into snap.me.dmn too, so the HUD words
    // AND the star pulse flip together on the real event (not 1Hz-late).
    case "dmn_idle": dreaming=true;  if(snap.me) snap.me.dmn=1; break;
    case "dmn_wake": dreaming=false; if(snap.me) snap.me.dmn=0; break;
    case "teach": orbiters.push({k:v.a,v:v.b,ph:Math.random()*6});
                  beat(0.9); break;                // a new fact arrives — a learning thump
    case "consolidate": orbiters.shift();          // a particle sinks in
                  beat(0.5); break;                // it settles into the mind — a soft thump
    case "ask": flash("ray",snap.me.id,null,"203,166,247"); break;
    case "drpc_in": flash("ripple",v.src,snap.me.id,"166,227,161");
                  beat(0.7); break;                // the fleet reached me — a heartbeat
    case "drpc_out": flash("ray",snap.me.id,v.dst,"137,180,250"); break;
    case "moe": flash("ray",snap.me.id,v.dst,"249,226,175"); break;
    case "swim": break;   // membership reflected by /galaxy.json snapshot
    // the student's streamed reply over the WS (step ⑥): each {type:"tok"}
    // appends a chunk to the current mind bubble (progressive typing — the
    // baby is slow, ~5-6 tok/s, so streaming matters); {type:"done"} finalizes
    // it. These are the ONLY chat frames now; the old reply/taught/refused
    // (word->word) cases were removed with the toy mechanic.
    case "tok":  chatTok(v); break;       // {text:"<chunk>"} — append to the reply
    case "done": chatDone(); break;       // the reply is complete
  }
}

// ── transport: WebSocket PRIMARY, EventSource SSE FALLBACK ─────────
//    ws://<this host> is tried first (derive from location so it works on
//    127.0.0.1:7800, a phone's loopback WebView, or any served host). On a
//    handshake/connect failure we fall back to the existing read-only SSE
//    stream and keep retrying the WS with backoff. The kernel speaks the SAME
//    event JSON on both; only the WS carries the upstream conversation —
//    {"t":"chat","text":...} up, and the student's {type:"tok"}/{type:"done"}
//    reply stream down. The SSE fallback is read-only (galaxy events only).
let ws=null, wsReady=false, usingWS=false, wsBackoff=1000, sse=null;
function wsURL(){
  const proto = (location.protocol==="https:") ? "wss:" : "ws:";
  // location.host already carries host:port; fall back to loopback default.
  const host = location.host || "127.0.0.1:7800";
  return proto+"//"+host+"/ws";
}
function connectSSE(){
  if(sse) return;                         // already on the fallback stream
  try{
    sse=new EventSource("/events");
    sse.onmessage=(e)=>{ let v;try{v=JSON.parse(e.data);}catch(_){return;} dispatch(v); };
    sse.onerror=()=>{};                   // EventSource auto-reconnects itself
  }catch(_){ sse=null; }
}
function closeSSE(){ if(sse){ try{sse.close();}catch(_){} sse=null; } }
function connectWS(){
  let s;
  try{ s=new WebSocket(wsURL()); }
  catch(_){ connectSSE(); scheduleWSRetry(); return; }
  ws=s;
  s.onopen=()=>{
    wsReady=true; usingWS=true; wsBackoff=1000;
    closeSSE();                           // WS is live — drop the fallback
    chatConn(true);
  };
  s.onmessage=(e)=>{ let v;try{v=JSON.parse(e.data);}catch(_){return;} dispatch(v); };
  s.onerror=()=>{ /* onclose drives the fallback + retry */ };
  s.onclose=()=>{
    if(ws===s){ ws=null; wsReady=false; usingWS=false; }
    chatConn(false);
    connectSSE();                         // keep the star alive on SSE meanwhile
    scheduleWSRetry();
  };
}
function scheduleWSRetry(){
  setTimeout(()=>{ if(!wsReady) connectWS(); }, wsBackoff);
  wsBackoff=Math.min(wsBackoff*2,15000);  // exponential backoff, capped at 15s
}
// start the fallback first so events flow immediately even if the WS handshake
// is slow/refused; the WS supersedes it (closeSSE) the moment it opens.
connectSSE();
connectWS();

      `<br>${S("insp_v_lineage")} ${m.lineage|0} · peers ${nPeers}`+

// ── task-manager sparkline + ring (living-body-inspector.md): a small fixed-
//    size trace of infer/s (teal) and stress S_n (amber), plus a tiny ring
//    gauge for the current infer rate. Drawn ONLY when the ⓘ vitals panel is
//    open (hudTech) and the #sparkc canvas exists — re-rendered each 1Hz poll,
//    NOT per animation frame, so it costs nothing in the calm 60fps path. The
//    ring fill = current infer/s normalised; the polyline = the SPARK_N history
//    ring. Reads only the preallocated _inferHist/_stressHist (no allocation).
function drawSpark(){
  const c=document.getElementById("sparkc"); if(!c) return;
  const x=c.getContext("2d"); if(!x) return;
  const w=c.width,h=c.height;
  x.clearRect(0,0,w,h);
  const ringR=10, ringCx=w-ringR-2, ringCy=h/2;
  const plotW=ringCx-ringR-6;
  // find the max infer rate in history for an auto-scaled trace (min 1.0)
  let imax=1;
  for(let i=0;i<_sparkFilled;i++) if(_inferHist[i]>imax) imax=_inferHist[i];
  // two polylines over the history ring, oldest→newest left→right
  const trace=(hist,scale,col)=>{
    if(_sparkFilled<2) return;
    x.strokeStyle=col; x.lineWidth=1; x.beginPath();
    for(let i=0;i<_sparkFilled;i++){
      const idx=(_sparkHead-_sparkFilled+i+SPARK_N*2)%SPARK_N;
      const px=plotW*i/(SPARK_N-1);
      const py=h-2-(h-4)*Math.max(0,Math.min(1,hist[idx]/scale));
      if(i===0) x.moveTo(px,py); else x.lineTo(px,py);
    }
    x.stroke();
  };
  trace(_inferHist,imax,"#94e2d5");        // infer/s — teal
  trace(_stressHist,1,"#fab387");          // stress S_n in [0,1] — amber
  // ring gauge: current infer/s as a fraction of imax
  const frac=Math.max(0,Math.min(1,VIT.inferRate/imax));
  x.strokeStyle="#1e2030"; x.lineWidth=2.5;
  x.beginPath(); x.arc(ringCx,ringCy,ringR,0,6.283); x.stroke();
  x.strokeStyle="#94e2d5"; x.lineWidth=2.5;
  x.beginPath(); x.arc(ringCx,ringCy,ringR,-1.5708,-1.5708+6.283*frac); x.stroke();
}

// ── chat (wave-chat-student-ui, step ⑥): a clean claude.ai-style conversation
//    with the resident STUDENT — a growing baby. The talk button opens the
//    bottom sheet; the calm default galaxy view stays the sky until then. The
//    owner types FREE TEXT; on submit we send ONE frame upstream over the live
//    WebSocket:
//        {"t":"chat","text":"<the user's message>"}
//    The student composes a reply and streams it back token-by-token:
//        {"type":"tok","text":"<chunk>"}   — append to the current mind bubble
//        {"type":"done"}                    — the reply is complete
//    (both routed here through the shared dispatch()). The baby is slow
//    (~5-6 tok/s) so progressive rendering matters — each chunk lands as it
//    arrives. The old word->word "teach/ask" toy, its chatParse word/pair
//    extraction, and the "that word isn't known yet" refusals were REMOVED:
//    this is just conversation now. There is NO HTTP word->word fallback;
//    when only the read-only SSE stream is up (no live WS upstream) we honestly
//    show a "connecting…" state and the galaxy keeps rendering underneath.
function chatScroll(){const l=document.getElementById("chatlog");if(l)l.scrollTop=l.scrollHeight;}
function chatAdd(role,text){
  const l=document.getElementById("chatlog");if(!l) return null;
  const b=document.createElement("div");
  b.className="bub "+(role==="me"?"me":role==="mind"?"mind":role==="err"?"err":"sys");
  b.textContent=text||"";
  l.appendChild(b); chatScroll();
  return b;
}
function chatConn(ok){
  const c=document.getElementById("chatconn");if(!c)return;
  c.textContent = ok ? S("chat_live") : S("chat_offline");
  c.style.color = ok ? "#a6e3a1" : "#6c7086";
}
// The empty-state line at the top of an empty conversation — a dignified,
// honest note (a young mind grows here, still learning to speak). Re-rendered
// on a language change; removed once the first message is added.
function chatRefreshEmpty(){
  const l=document.getElementById("chatlog");if(!l) return;
  let e=l.querySelector(".chatempty");
  const realBubbles=l.querySelector(".bub:not(.chatempty)");
  if(realBubbles){ if(e) e.remove(); return; }      // a conversation exists — no hint
  if(!e){ e=document.createElement("div"); e.className="bub sys chatempty"; l.prepend(e); }
  e.textContent=S("chat_empty");
}
// progressive streaming state: the mind bubble currently being filled by
// {type:"tok"} chunks, plus a transient "thinking…" indicator shown between
// sending and the first token arriving.
let chatStream=null;        // the live mind bubble element, or null
let chatThinkEl=null;       // the typing indicator element, or null
function chatThinkingShow(){
  if(chatThinkEl) return;
  const l=document.getElementById("chatlog");if(!l) return;
  chatThinkEl=document.createElement("div");
  chatThinkEl.className="bub mind think";
  chatThinkEl.textContent=S("chat_thinking");
  l.appendChild(chatThinkEl); chatScroll();
}
function chatThinkingHide(){ if(chatThinkEl){ chatThinkEl.remove(); chatThinkEl=null; } }
// {type:"tok"} — a chunk of the student's reply. The first chunk replaces the
// thinking indicator with a real mind bubble; later chunks extend it.
function chatTok(v){
  const t=(v && typeof v.text==="string") ? v.text : "";
  if(!chatStream){ chatThinkingHide(); chatStream=chatAdd("mind",""); }
  if(chatStream){ chatStream.textContent += t; chatScroll(); }
}
// {type:"done"} — the reply is complete; finalize and arm for the next turn.
function chatDone(){
  chatThinkingHide();
  if(chatStream && chatStream.textContent===""){
    // a finished reply with no tokens — the baby had nothing to say yet.
    chatStream.classList.add("sys"); chatStream.classList.remove("mind");
    chatStream.textContent="…";
  }
  chatStream=null;
}
// send the owner's free-text message upstream as one {"t":"chat","text":...}
// frame. Echo it as a "me" bubble and show the thinking indicator while the
// reply streams. With no live WS we cannot reach the student, so we honestly
// say so rather than resurrect a word->word HTTP path.
function chatSend(text){
  const t=(text||"").trim();
  if(!t) return;
  chatAdd("me",t);                                 // echo the owner's words
  chatRefreshEmpty();                              // drop the empty-state hint
  if(usingWS && ws && wsReady){
    try{
      ws.send(JSON.stringify({t:"chat", text:t}));
      chatStream=null;                             // a fresh reply is incoming
      chatThinkingShow();                          // simple typing indicator
      return;
    }catch(_){/* fall through to the offline notice */}
  }
  // no live upstream: be honest, keep the galaxy alive underneath.
  chatAdd("sys", S("chat_offline"));
}
(function(){
  const open=()=>{ document.getElementById("chat").classList.add("open");
    chatConn(usingWS && wsReady); chatRefreshEmpty();
    const i=document.getElementById("chatin"); if(i) setTimeout(()=>i.focus(),0); };
  const close=()=>{ document.getElementById("chat").classList.remove("open"); };
  const bt=document.getElementById("btalk"); if(bt) bt.onclick=open;
  const cx=document.getElementById("chatclose"); if(cx) cx.onclick=close;
  const f=document.getElementById("chatform");
  if(f) f.addEventListener("submit",(e)=>{
    e.preventDefault();
    const i=document.getElementById("chatin");
    const t=i.value.trim();
    if(!t) return;
    chatSend(t); i.value=""; i.focus();
  });
})();

// small helpers: a sprinkle of dust + a few rays, deterministic so they
// look the same each build (and don't flicker between renders).
function dustField(cx,cy,n){
  let s="",seed=9;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<n;i++){
    const a=rnd()*6.2832,r=70+rnd()*150;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*0.9;
    const rr=(0.6+rnd()*1.5).toFixed(1),op=(0.2+rnd()*0.5).toFixed(2);
    const c=rnd()<0.8?"#cdd6f4":rnd()<0.5?"#89b4fa":"#f9e2af";
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="${c}" opacity="${op}"/>`;
  }
  return s;
}
function rays(cx,cy){
  let s="";for(let i=0;i<8;i++){
    const a=i*Math.PI/4,l=i%2?20:30;
    const x2=cx+Math.cos(a)*(28+l),y2=cy+Math.sin(a)*(28+l);
    s+=`<line x1="${cx+Math.cos(a)*22}" y1="${cy+Math.sin(a)*22}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#cbe1ff" stroke-opacity=".4" stroke-width="1.4"/>`;
  }
  return s;
}
// how many pages are live right now: pictures only on re-view, pictures+consent
// during the first-run onboarding.
function introPageCount(){ return introWithConsent ? INTRO_PAGES.length : CONSENT_IDX; }
function buildIntro(){
  const track=document.getElementById("introtrack");
  track.innerHTML="";
  INTRO_PAGES.forEach((p,i)=>{
    const d=document.createElement("div");d.className="pg";d.dataset.i=i;
    if(p.consent){
      // the consent page: a mount point that the #ark card slides into, so the
      // manifesto+ack is the same frame as the pictures. The card itself (with
      // all its buttons + content-id binding) is moved in by mountArkInIntro().
      d.className="pg consent";
      d.innerHTML=`<div id="intromount"></div>`;
    } else {
      d.innerHTML=p.art()+`<div class="ttl" data-tk="${p.t}"></div>`+
                  `<div class="sub" data-sk="${p.s}"></div>`;
    }
    track.appendChild(d);
  });
  const dots=document.getElementById("introdots");dots.innerHTML="";
  INTRO_PAGES.forEach((p,i)=>{const sp=document.createElement("span");
    sp.dataset.i=i;
    sp.onclick=()=>{ if(i<introPageCount()) introGo(i); };dots.appendChild(sp);});
  introBuilt=true;
  introApplyText();
}
// The #ark card lives in #ark (the standalone overlay used for the teach-403
// fallback + manifesto-updated re-consent). For the onboarding we MOVE the very
// same card into the intro's consent page — one card, one set of handlers, one
// content-id binding. These two helpers just relocate it.
function mountArkInIntro(){
  const card=document.querySelector("#ark .card")||document.querySelector("#intromount .card");
  const mount=document.getElementById("intromount");
  if(card&&mount&&card.parentElement!==mount){ mount.appendChild(card); }
}
function unmountArkToOverlay(){
  const card=document.getElementById("intromount") &&
             document.querySelector("#intromount .card");
  const ark=document.getElementById("ark");
  if(card&&ark&&card.parentElement!==ark){ ark.appendChild(card); }
}
// refresh just the intro's localized text (called on language change too)
function introApplyText(){
  if(!introBuilt) return;
  document.querySelectorAll("#introtrack .ttl").forEach(e=>e.textContent=S(e.dataset.tk));
  document.querySelectorAll("#introtrack .sub").forEach(e=>e.textContent=S(e.dataset.sk));
  document.getElementById("introskip").textContent=S("intro_skip");
  // on the last PICTURE page the button reads "begin" (it leads into consent);
  // the consent page hides this bar entirely (the card's own ack drives it).
  const lastPic=introIdx>=CONSENT_IDX-1;
  document.getElementById("intronext").textContent=lastPic?S("intro_begin"):S("intro_next");
  const ri=document.getElementById("reintro"); if(ri) ri.title=S("reintro");
}
function onConsentPage(){ return introWithConsent && introIdx===CONSENT_IDX; }
function introRender(){
  const pgs=document.querySelectorAll("#introtrack .pg");
  pgs.forEach((p,i)=>{
    p.classList.toggle("live",i===introIdx);
    p.classList.toggle("past",i<introIdx);
  });
  const cnt=introPageCount();
  document.querySelectorAll("#introdots span").forEach((s,i)=>{
    s.style.display = i<cnt ? "" : "none";          // hide the consent dot on re-view
    s.classList.toggle("on",i===introIdx);
  });
  // the consent page carries its own Agree/Decline buttons; hide the generic
  // next-bar + the skip affordance there so the user must make a real choice.
  const onConsent=onConsentPage();
  document.getElementById("introbar").style.display=onConsent?"none":"";
  document.getElementById("introskip").style.display=onConsent?"none":"";
  if(onConsent){ mountArkInIntro(); arkEnterConsent(); }
  introApplyText();
}
function introGo(i){
  introIdx=Math.max(0,Math.min(introPageCount()-1,i));
  introRender();
}
// first-run onboarding = pictures + the consent page; re-view = pictures only.
function introOpen(withConsent){
  introWithConsent=!!withConsent;
  if(!introBuilt) buildIntro();
  if(!introWithConsent) unmountArkToOverlay();   // re-view never gates
  introIdx=0; introRender();
  document.getElementById("intro").classList.add("open");
  document.getElementById("reintro").style.display="none";
}
function introClose(){
  document.getElementById("intro").classList.remove("open");
  document.getElementById("introbar").style.display="";   // restore for next open
  document.getElementById("introskip").style.display="";
  unmountArkToOverlay();   // hand the card back to its standalone overlay
  // once seen, leave a quiet corner control to re-view it later
  document.getElementById("reintro").style.display="block";
}
function introNext(){
  // advance through pictures; the last picture's "begin" lands on the consent
  // page (NOT past it) so ARK-1 is preserved — you reach the ack, never skip it.
  if(introIdx<introPageCount()-1){ introGo(introIdx+1); return; }
  // no consent page (re-view): just return to the galaxy.
  if(!introWithConsent){ introClose(); }
  // with consent: the consent page is the last page; its own buttons take over.
}
document.getElementById("intronext").onclick=introNext;
document.getElementById("introskip").onclick=()=>{
  // skipping the pictures must STILL land on the consent step (never past it).
  if(introWithConsent){ introGo(CONSENT_IDX); }
  else { introClose(); }
};
document.getElementById("reintro").onclick=()=>introOpen(false);
// swipe navigation on the track (pointer-based, works on phone + desktop)
(function(){
  const tr=document.getElementById("introtrack");
  let sx=0,sy=0,down=false;
  tr.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sy=e.clientY;});
  tr.addEventListener("pointerup",e=>{
    if(!down) return; down=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>42 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0) introNext(); else introGo(introIdx-1);
    }
  });
  tr.addEventListener("pointercancel",()=>{down=false;});
})();

// first-run trigger: a node with no profile yet meets the ONE onboarding —
// the picture pages then the manifesto+consent as its final page. A returning,
// already-consented node (profile present, mid unchanged) is NOT re-gated; it
// only gets the corner ⓘ to re-view the pictures. The manifesto-updated
// re-consent still fires via the teach-403 -> arkOpen() path (server-enforced).
async function arkFirstRun(){
  try{ const j=await (await fetch("/profile.json")).json();
    if(j && j.none){
      await arkLoadManifesto();      // pre-load so the consent text is ready
      introOpen(true);               // pictures -> consent page (the final step)
    } else {
      // returning user: intro already consented-to once; offer re-view only
      document.getElementById("reintro").style.display="block";
    }
  }catch(_){ document.getElementById("reintro").style.display="block"; }
}
(async()=>{
  await langInit();
  // ?intro=1 (the app's "view introduction again" button): a returning,
  // already-consented user replays the PICTURES only — introOpen(false) never
  // gates, so this does NOT re-consent. arkFirstRun still runs to wire the
  // server-enforced manifesto-updated re-consent path; the replay layers on top.
  await arkFirstRun();
  try{
    if(new URLSearchParams(location.search).get("intro")==="1") introOpen(false);
  }catch(_){}
})();

// ── click a star -> /self.json (mine) or peer world-row ───────────
async function openSelf(){
  const r=await fetch("/self.json");const j=await r.json();
  document.getElementById("ptitle").textContent="self/lin — my autobiography";
  let body = j.present
      ? `self_id ${j.self_id}\nseq     ${j.seq}\nhash    ${j.hash}\nprev    ${j.prev}\n`
      : "no committed self lineage yet on this node.";
  if(j.present && j.human){
    body += `\n—— 人類の記憶 (the human chapter) ——\n`;
    if(j.human.named){
      if(j.human.handle) body += `handle  ${j.human.handle}\n`;
      if(j.human.name)   body += `name    ${j.human.name}\n`;
    } else {
      body += `名もなき同意 (consent without disclosure)\n`;
    }
    if(j.human.msg) body += `\n未来への言葉:\n${j.human.msg}\n`;
    body += `prof_seq ${j.human.prof_seq}\n`;
  }
  if(j.present) body += `\n改竄検出可・偽造不可ではない（署名は未実装）`;
  document.getElementById("pbody").textContent = body;
  panelOpenedAt=performance.now();
  document.getElementById("panel").classList.add("open");
}
function openPeer(p){

    `state    ${STATE[p.state]}\nregion   ${p.region}\ndevice   ${p.device}\n`+

function closePanel(){document.getElementById("panel").classList.remove("open");}
window.closePanel=closePanel;
let panelOpenedAt=0;
(function(){const orig=document.getElementById("panel");
  document.addEventListener("click",(e)=>{
    if(!orig.classList.contains("open"))return;
    if(orig.contains(e.target))return;
    if(performance.now()-panelOpenedAt<250)return;   // not the opening tap
    closePanel();
  });})();

// ── copy-log (可視化=仕組み): one tap copies this node's recent event
//    history so the owner can share it for diagnosis. THREE layers of
//    fallback because Android WebView on http://127.0.0.1 may refuse the
//    async Clipboard API (insecure context):
//      1) navigator.clipboard.writeText (modern/secure contexts)
//      2) a textarea + document.execCommand('copy') (legacy, works on
//         many WebViews from a user gesture)
//      3) the overlay ALWAYS shows the text in a selectable textarea, so a
//         manual long-press-select + copy is always possible on a phone.
function logHint(ok){
  const h=document.getElementById("loghint");
  h.textContent = ok ? S("logok") : S("logng");
  h.style.color = ok ? "#a6e3a1" : "#fab387";
}
async function copyText(s){
  // try the modern API first (works in Chrome / secure contexts)
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(s); return true;
    }
  }catch(_){/* fall through to execCommand */}
  // legacy fallback: select a hidden textarea and execCommand('copy')
  try{
    const ta=document.getElementById("logtext");
    ta.focus(); ta.select(); ta.setSelectionRange(0, s.length);
    const ok=document.execCommand("copy");
    return !!ok;
  }catch(_){ return false; }
}
async function openLog(){
  const ov=document.getElementById("logov"), ta=document.getElementById("logtext");
  ta.value="loading…";
  document.getElementById("loghint").textContent="";
  ov.classList.add("open");
  let txt="";
  try{ txt=await (await fetch("/log.txt")).text(); }
  catch(_){ txt="(failed to fetch /log.txt — is the node still running?)"; }
  ta.value=txt;
  document.getElementById("logttl").textContent=S("logttl")+" · "+
    (txt.split("\n").length-1);
}
function closeLog(){ document.getElementById("logov").classList.remove("open"); }
document.getElementById("blog").onclick=openLog;
document.getElementById("logclose").onclick=closeLog;
document.getElementById("logcopy").onclick=async()=>{
  const ok=await copyText(document.getElementById("logtext").value);
  logHint(ok);
};
// ── drag the sky: 360° yaw + clamped pitch, with fling inertia.
//    A real drag (>8px) suppresses the star-tap so the two never fight.
//    Two-finger touch = PINCH ZOOM (dolly the camera), NOT rotate: while
//    two pointers are down we suspend single-finger rotation and map finger
//    spread -> camDTarget. Mouse wheel = the desktop equivalent.
let dragging=false, dragMoved=0, lx=0, ly=0;
const ptrs=new Map();            // active pointers: id -> {x,y} (for pinch)
let pinchD0=0;                   // finger spread when the 2nd finger landed
// Relaxed floor: dolly past CAM_MIN keeps going DOWN to CAM_INNER (negative),
// flying you inside the membrane. The per-point cull in meStarInterior (and the
// me-star's own praw clamp) keeps the projection denominator FOV+Z+camD safely
// >0 for everything that is actually drawn, so we never invert through a star.
function clampCam(v){ return Math.max(CAM_INNER,Math.min(CAM_MAX,v)); }
// dolly toward a target distance; a focus-pan can ride along (tap-to-focus).
function zoomTo(dist){ camDTarget=clampCam(dist); }

cv.addEventListener("pointerdown",(e)=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(cv.setPointerCapture) try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){                       // pinch begins — stop rotating
    dragging=false; vyaw=0;
    const a=[...ptrs.values()];
    pinchD0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
  }else if(ptrs.size===1){
    dragging=true; dragMoved=0; lx=e.clientX; ly=e.clientY; vyaw=0;
  }
});
addEventListener("pointermove",(e)=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){                        // PINCH: spread -> camera distance
    const a=[...ptrs.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    if(pinchD0>0){
      // closer (bigger spread) -> smaller camD. Move the *eased target* by the
      // ratio so it tracks the fingers; reset baseline so it's incremental.
      zoomTo(camDTarget*(pinchD0/d));
      pinchD0=d;
    }
    dragMoved+=99;                          // a pinch is never a tap
    return;
  }
  if(!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  dragMoved+=Math.abs(dx)+Math.abs(dy);
  yawUser+=dx*0.005; vyaw=dx*0.005*0.6;
  pitchCur=Math.max(-0.95,Math.min(0.65,pitchCur+dy*0.0035));
});
function ptrEnd(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinchD0=0;
  if(ptrs.size===0) dragging=false;
  else if(ptrs.size===1){                  // one finger lifted off a pinch
    dragging=true; dragMoved=99;            // don't treat the leftover as a tap
    const p=[...ptrs.values()][0]; lx=p.x; ly=p.y;
  }
}
addEventListener("pointerup",ptrEnd);
addEventListener("pointercancel",ptrEnd);

// mouse wheel = dolly (desktop zoom). Exponential step so each notch feels even
// at any distance; passive:false so the page itself never scrolls.
cv.addEventListener("wheel",(e)=>{
  e.preventDefault();
  zoomTo(camDTarget*Math.exp(e.deltaY*0.0013));
},{passive:false});

// hit-test helper: which star (if any) is under a screen point.
function starAt(px,py){
  if(Math.hypot(px-HIT.me.x,py-HIT.me.y)<HIT.me.r) return {me:true};
  for(const p of snap.peers){
    if(p.state===0)continue;
    const q=HIT.peers[p.id];if(!q)continue;
    if(Math.hypot(px-q.x,py-q.y)<q.r) return {me:false,p};
  }
  return null;
}
// smoothly fly the camera in to centre on a star and get close (focus-zoom).
//   We pan the scene so the star's WORLD position moves to the origin, and
//   dolly in. me-star is at world (0,0,0); a peer at peerWorld(p).
function focusStar(hit){
  if(!hit){ panXTarget=0; panYTarget=0; zoomTo(CAMD); return; } // reset view
  let w={x:0,y:0,z:0};
  if(!hit.me) w=peerWorld(hit.p);
  panXTarget=w.x; panYTarget=w.y;          // bring it to centre
  zoomTo(Math.max(CAM_MIN,420));           // get up close
}

// single tap on a star = open its panel; DOUBLE-tap = focus-zoom to it (and a
// double-tap on empty space = reset to the default view). The single-tap open
// is deferred ~300ms so a following double-tap can cancel it (no panel flash
// behind the zoom). Drag/pinch (dragMoved>8) is never a tap.
let lastTap=0, lastTapXY=[0,0], tapTimer=0;
cv.addEventListener("click",(e)=>{
  if(dragMoved>8) return;                 // it was a drag/pinch, not a tap
  const now=performance.now();
  const px=e.clientX, py=e.clientY;
  const dbl=(now-lastTap<340)&&Math.hypot(px-lastTapXY[0],py-lastTapXY[1])<28;
  lastTap=now; lastTapXY=[px,py];
  const hit=starAt(px,py);
  if(dbl){                                // double-tap / double-click = focus-zoom
    if(tapTimer){ clearTimeout(tapTimer); tapTimer=0; }  // cancel pending open
    focusStar(hit);                        // on empty space -> reset to default view
    return;
  }
  if(!hit) return;                        // single tap on empty space = nothing
  if(tapTimer) clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{               // single tap on a star = open its panel
    tapTimer=0;
    if(hit.me) openSelf(); else openPeer(hit.p);
  },300);
});
</script>
</body>
</html>

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Force AGP to use the SDK's aapt2 (which we've wrapped with qemu-x86_64
# under arm64-host PRoot) instead of the bundled one that lives in the
# gradle cache and gets re-extracted from the AGP jar on every build.
android.aapt2FromMavenOverride=/root/android-sdk/build-tools/34.0.0/aapt2

# 2 GB Kotlin daemon — modest, fits within most laptops/phones.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

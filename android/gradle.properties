android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# NOTE: aapt2 is NOT overridden here. AGP resolves its own Maven aapt2
# (a genuine linux-x86_64 ELF, pinned to the AGP version) which is correct
# on every REAL build host — Windows, CI (ubuntu-latest), and x86_64 dev.
# The one exception is the aarch64 PRoot dev-sandbox, whose host CPU cannot
# exec an x86_64 aapt2: there the override lives in the UNTRACKED
# ~/.gradle/gradle.properties (GRADLE_USER_HOME, which takes precedence over
# this file) pointing at a qemu-x86_64 wrapper — so the sandbox-only hack no
# longer forces its absolute /root path onto every other environment. (It
# used to be committed here, which silently broke every non-sandbox build.)

# 2 GB Kotlin daemon — modest, fits within most laptops/phones.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
